id: vocabulary.say-tell-ask
title: Say, Tell, Ask, Speak and Talk
kind: vocabulary
level: A1-A2
category: vocabulary.communication
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [48]
source_coverage: Unit 48 say/tell/ask plus answer/reply/speak/talk chunks and object/preposition patterns are represented.
core_concept: These communication verbs differ in what follows them: words/message, person, request/question, language or conversation partner.
mental_model: Message only -> say; person receiving information -> tell; request/question -> ask; language -> speak; conversation -> talk to/with.
key_items:
  - say something / say goodbye
  - tell somebody something
  - tell somebody a story/joke
  - ask a question
  - ask for something
  - ask somebody to do something
  - answer the phone/door/question
  - reply to an email
  - speak a language
  - talk to a friend
common_mistakes:
  - Tell normally takes a person directly; say does not: tell me, but say something to me.
  - Reply uses to for its target: reply to an email.
examples:
  - Can you tell me the time?
  - She asked me to review it and I replied to her email.
recognition_drills:
  - Choose say/tell/ask/speak/talk/answer/reply based on the following object/pattern.
production_drills:
  - Transform one message into natural sentences with say, tell and ask.
speaking_drills:
  - What language do you speak at work, and who do you talk to most?
