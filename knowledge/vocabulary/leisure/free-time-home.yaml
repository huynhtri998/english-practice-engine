id: vocabulary.free-time-home
title: Free Time at Home
kind: vocabulary
level: A1-A2
category: vocabulary.leisure
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [25]
source_coverage: Unit 25 common at-home leisure activities and personal-frequency questions are represented.
core_concept: Use everyday verb-noun chunks to talk about what you do at home in your free time.
mental_model: Retrieve activities as chunks, then add frequency or preference.
key_items:
  - gardening
  - cooking
  - reading
  - using the Internet
  - watching DVDs
  - listening to music
  - doing nothing
  - chatting online
  - video games
  - headphones
collocations:
  - listen to music
  - read magazines / newspapers
  - talk to somebody on the phone
  - have friends round
  - invite friends to dinner
  - play video games
  - download music / films
  - watch a programme
  - grow vegetables
common_mistakes:
  - Learn the activity with its verb: listen to music, play games, watch a programme, grow vegetables.
examples:
  - I often listen to music while I cook.
  - We sometimes have friends round at the weekend.
recognition_drills:
  - Match ten home activities with the correct verbs.
production_drills:
  - Describe your normal evening at home using four activity chunks.
speaking_drills:
  - What do you usually do at home when you have free time?
