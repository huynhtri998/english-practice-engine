id: vocabulary.music
title: Music and Musical Instruments
kind: vocabulary
level: A1-A2
category: vocabulary.leisure
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [26]
source_coverage: Unit 26 music/musical/musician, instrument names, play/lesson/orchestra patterns and music genres are represented.
core_concept: Distinguish music, musical and musician, and learn instrument/genre vocabulary with natural play/listen chunks.
mental_model: Thing/activity = music; adjective = musical; person = musician. Then retrieve instrument or genre with its normal chunk.
key_items:
  - music
  - musical
  - musician
  - flute
  - piano
  - cello
  - guitar
  - drums
  - violin
  - trumpet
  - clarinet
  - orchestra
  - classical music
  - opera
  - pop music
  - folk music
  - jazz
  - rock
collocations:
  - play the guitar / piano / violin
  - play the drums
  - have piano lessons
  - play in an orchestra
  - listen to music
  - download songs
  - go to a concert
common_mistakes:
  - Music is uncountable in the source: avoid musics.
  - Say musical instruments, not music instruments.
  - Use classical music, not classic music, for the genre.
  - A band is a group of musicians; a concert is an event.
examples:
  - She plays the clarinet in an orchestra.
  - I listen to jazz more often than classical music.
recognition_drills:
  - Choose music, musical or musician in short contexts and match instruments to play-patterns.
production_drills:
  - Describe your music preferences and one instrument you can or would like to play.
speaking_drills:
  - What music do you listen to most, and can you play an instrument?
