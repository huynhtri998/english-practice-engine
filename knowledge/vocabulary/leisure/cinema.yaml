id: vocabulary.cinema
title: Cinema
kind: vocabulary
level: A1-A2
category: vocabulary.leisure
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [24]
source_coverage: Unit 24 film types, people in films and common cinema conversation patterns are represented.
core_concept: Talk about film genres, people connected with films, whether you have seen a film and what you thought of it.
mental_model: Genre -> people -> seen it? -> opinion -> cinema/home viewing habit.
key_items:
  - western
  - cartoon
  - horror film
  - comedy
  - thriller
  - action film
  - science fiction film
  - musical
  - romantic comedy
  - film star
  - director
collocations:
  - be in a film
  - play a character
  - a film by a director
  - the latest film
  - what's on at the cinema
  - go to the cinema
  - enjoy a film
common_mistakes:
  - Say What's on at the cinema?, not What's on the cinema?.
  - Say go to the cinema in the source variety of English.
examples:
  - Have you seen the latest science fiction film?
  - I enjoyed it, but my friend thought it was boring.
recognition_drills:
  - Match film genres with short descriptions and choose the natural cinema phrase.
production_drills:
  - Describe a film you saw using genre, one person-role word and an opinion.
speaking_drills:
  - What kind of films do you like best, and do you go to the cinema often?
