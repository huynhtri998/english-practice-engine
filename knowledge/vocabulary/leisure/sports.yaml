id: vocabulary.sports
title: Sports
kind: vocabulary
level: A1-A2
category: vocabulary.leisure
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [23]
source_coverage: Unit 23 ball games, other popular sports, play/go/do patterns and common sports locations are represented.
core_concept: Learn sport names together with the natural verb and place used with them.
mental_model: Sport name is not enough: retrieve the whole chunk play/go/do + sport and, when useful, the typical place.
key_items:
  - football
  - rugby
  - basketball
  - badminton
  - baseball
  - tennis
  - volleyball
  - table tennis
  - running
  - sailing
  - swimming
  - kayaking
  - judo
  - karate
  - skiing
  - snowboarding
collocations:
  - play football / tennis / badminton
  - go running / swimming / skiing / kayaking
  - do judo / karate
  - tennis court
  - football pitch
  - swimming pool
  - sports centre
common_mistakes:
  - Use play with ball/racket games, go + -ing with many activity sports, and do with judo/karate in the source patterns.
examples:
  - I go running twice a week.
  - She does judo at the sports centre.
recognition_drills:
  - Choose play, go or do for a mixed list of sports.
production_drills:
  - Give the natural verb + sport chunk for six sports.
speaking_drills:
  - What sports do you do, and where do you do them?
related:
  - vocabulary.verb.go
