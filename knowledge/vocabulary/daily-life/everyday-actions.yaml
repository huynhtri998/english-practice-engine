id: vocabulary.everyday-actions
title: Everyday Actions and Routines
kind: vocabulary
level: A1-A2
category: vocabulary.daily-life
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [47]
source_coverage: Unit 47 daily routine sequence, occasional actions, frequency/time questions and transport answers are represented.
core_concept: Store routine vocabulary as verb-noun chunks and retrieve it through time, frequency and transport questions.
mental_model: Wake -> morning routine -> work -> home -> evening -> bed.
key_items:
  - wake up
  - get up
  - go to the bathroom
  - have a shower
  - have breakfast
  - listen to the radio
  - go to work
  - come home
  - make dinner
  - phone/call a friend
  - watch TV
  - go to bed
  - wash clothes
  - clean the house
  - go for a walk
  - write emails
collocations:
  - How often do you ...?
  - What time do you ...?
  - go to work by bus/train/car
common_mistakes:
  - Use usually for a present routine; used to refers to a past habit/state that is different now.
examples:
  - I usually get up at seven, but today I got up later.
recognition_drills:
  - Put routine chunks in a natural daily order and choose time/frequency questions.
production_drills:
  - Describe a weekday from waking up to going to bed.
speaking_drills:
  - What time do you normally get up on workdays?
