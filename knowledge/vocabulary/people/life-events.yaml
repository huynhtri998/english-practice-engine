collocations:
- have a baby
- be born in/on
- get married to somebody
- go on honeymoon
- die of something
common_mistakes:
- Say have a baby, not get a baby.
- Say was born, not is born for a past birth.
- Use married to, not married with.
- Use died for the verb, dead for the adjective, and death for the noun.
