id: vocabulary.life-events
title: Birth, Marriage and Death
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [2]
source_coverage: Unit 2 vocabulary for birth, relationship status, marriage, wedding/honeymoon and death is represented with its highlighted error patterns.
core_concept: Use fixed English chunks for major life events; several of them do not translate word-for-word naturally.
mental_model: Recall the whole event phrase: be born, have a baby, get married to, die of.
key_items:
  - birthday
  - be born
  - weigh
  - single
  - married
  - widowed
  - separated
  - divorced
  - bride
  - groom
  - wedding
  - honeymoon
  - funeral
  - die
  - dead
  - death
collocations:
  - have a baby
  - be born in/on/at
  - get married
  - get married to somebody
  - go on honeymoon
  - die of a heart attack
common_mistakes:
  - Say "have a baby", not "get a baby" for giving birth.
  - Say "was born", not "is born" when talking about a person's birth in the past.
  - Say "married to", not "married with".
  - Distinguish die (verb), dead (adjective) and death (noun).
examples:
  - My cousin got married last year.
  - Her baby was born in June.
recognition_drills:
  - Choose the natural chunk for birth, marriage and death situations.
production_drills:
  - Translate a short life-event sentence using be born or get married to.
speaking_drills:
  - Where were you born?
related:
  - vocabulary.family
  - grammar.be-past
