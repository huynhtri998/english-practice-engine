id: vocabulary.health-illness
title: Health and Illness
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [6]
source_coverage: Unit 6 common symptoms/illnesses, basic treatment chunks and health-related personalisation are represented.
core_concept: Learn health vocabulary as symptom + natural response/treatment chunks rather than isolated nouns.
mental_model: What is wrong? -> name the symptom/illness -> say what someone does about it.
key_items:
  - feel sick
  - feel ill
  - headache
  - toothache
  - a cold
  - heart attack
  - asthma
  - hay fever
  - cancer
  - operation
  - exercise
  - stressed
collocations:
  - have a headache
  - have toothache
  - have a cold
  - take an aspirin
  - go to the dentist
  - go to hospital
  - go to bed with a hot drink
common_mistakes:
  - Use have/have got with common symptoms such as a headache or a cold in the patterns taught by the book.
examples:
  - I've got a headache, so I'm going to rest.
  - She went to the dentist because she had toothache.
recognition_drills:
  - Match a common symptom to the natural basic response taught in the unit.
production_drills:
  - Translate one short health complaint and one response sentence.
speaking_drills:
  - What do you usually do when you have a cold?
related:
  - vocabulary.body-parts
  - vocabulary.feelings
