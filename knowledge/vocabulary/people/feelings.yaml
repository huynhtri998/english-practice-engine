id: vocabulary.feelings
title: Feelings
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [7]
source_coverage: Unit 7 like/love/hate, common states, prefer/hope/want and source-highlighted pattern errors are represented.
core_concept: Express preferences, wants, hopes and everyday physical/emotional states with the natural verb patterns that accompany them.
mental_model: Learn the feeling word together with the sentence frame it normally uses.
key_items:
  - love
  - like
  - don't like
  - hate
  - happy
  - sad
  - angry
  - upset
  - cold
  - hot
  - thirsty
  - hungry
  - well
  - ill
  - tired
  - surprised
  - prefer
  - hope
  - want
collocations:
  - prefer coffee to tea
  - hope to do something
  - hope that ...
  - want something
  - want to do something
  - want somebody to do something
  - really like something
  - like something very much
common_mistakes:
  - Say "I really like it" or "I like it very much", not "I very like it".
  - Say "want somebody to do something", not "want that somebody does something".
  - Use "happy about" news/results; "happy for" a person can mean pleased on their behalf.
examples:
  - I really like learning new tools.
  - I want my English to become more automatic.
recognition_drills:
  - Choose the natural pattern after prefer, hope or want.
production_drills:
  - Make one sentence with prefer ... to ... and one with want somebody to ...
speaking_drills:
  - What do you prefer doing after work?
related:
  - vocabulary.health-illness
  - vocabulary.conversation-expressions
