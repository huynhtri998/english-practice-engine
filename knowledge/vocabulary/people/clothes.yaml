id: vocabulary.clothes
title: Clothes
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [4]
source_coverage: Unit 4 common clothing items, body associations and get dressed/undressed and put on/take off patterns are represented.
core_concept: Learn clothes as wearable sets and with the verbs used to describe wearing and changing clothes.
mental_model: Item + body area + action: wear it, put it on, take it off.
key_items:
  - suit
  - shirt
  - tie
  - T-shirt
  - shorts
  - trousers
  - socks
  - trainers
  - belt
  - jacket
  - coat
  - jumper
  - skirt
  - boots
  - hat
  - scarf
  - gloves
  - tights
  - glasses
  - watch
collocations:
  - wear a coat
  - put your clothes on
  - take your clothes off
  - get dressed
  - get undressed
  - a pair of glasses
common_mistakes:
  - Use wear for the state of having clothes on; use put on/take off for the change.
examples:
  - I'm wearing a black T-shirt and jeans.
  - I took my coat off when I got home.
recognition_drills:
  - Choose wear, put on or take off for a fresh clothing situation.
production_drills:
  - Describe what you are wearing now in one or two sentences.
speaking_drills:
  - What do you usually wear to work?
related:
  - vocabulary.describing-people
