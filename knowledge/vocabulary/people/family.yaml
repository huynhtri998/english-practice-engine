id: vocabulary.family
title: The Family
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [1]
source_coverage: Unit 1 core family relationships and family-tree language are represented; copied diagrams and exercises remain in the source.
core_concept: Use relationship words as connected pairs in a family network, not as isolated translations.
mental_model: Start from one person and ask how another person is related to them.
key_items:
  - mother
  - father
  - parents
  - son
  - daughter
  - children
  - brother
  - sister
  - husband
  - wife
  - grandmother
  - grandfather
  - grandparents
  - uncle
  - aunt
  - cousin
  - nephew
  - niece
  - grandchildren
  - only child
collocations:
  - have a brother/sister
  - have got two cousins
  - come from a big family
common_mistakes:
  - Keep nephew and niece distinct by gender.
  - Wife has the irregular plural wives.
examples:
  - I have one brother and two cousins.
  - My aunt has a son, so he is my cousin.
recognition_drills:
  - Give a short family relationship and ask for the correct family word.
production_drills:
  - Give a Vietnamese family relationship and ask for one natural English sentence.
speaking_drills:
  - Tell me about two people in your family.
related:
  - vocabulary.life-events
  - grammar.possessive-s
