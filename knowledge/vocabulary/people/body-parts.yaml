- thumb
- chest
- stomach
- back
- waist
- hip
- leg
- knee
- foot/feet
- toe
- skin
- heart
- brain
- blood
collocations:
- wash your hair
- a pain in my leg
common_mistakes:
- 'Use possessives with body parts in normal personal contexts: my leg, her hair.'
- Hair is normally singular as a mass noun; feet and teeth are irregular plurals.
recognition_drills:
- Create a fresh matching/choice item using the key vocabulary for Parts of the Body; do not copy the source exercise.
production_drills:
- Give a short Vietnamese prompt that naturally requires vocabulary from Parts of the Body, then wait for an English
  answer.
speaking_drills:
- Ask one short personal question that naturally elicits two or more items from Parts of the Body.
