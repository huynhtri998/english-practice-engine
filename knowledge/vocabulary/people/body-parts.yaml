id: vocabulary.body-parts
title: Parts of the Body
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [3]
source_coverage: Unit 3 head/face, limbs, main body areas, selected internal body words, pronunciation notes, irregular plurals and possessive usage are represented.
core_concept: Learn body words together with their natural possessive patterns and irregular forms.
mental_model: Name the body part, then attach it to a person with my/your/his/her when the context is personal.
key_items:
  - hair
  - eye
  - ear
  - nose
  - mouth
  - lip
  - tooth/teeth
  - neck
  - shoulder
  - arm
  - hand
  - finger
  - thumb
  - chest
  - stomach
  - back
  - waist
  - hip
  - leg
  - knee
  - foot/feet
  - toe
  - skin
  - heart
  - brain
  - blood
collocations:
  - wash your hair
  - wash your face
  - a pain in my leg
pronunciation_notes:
  - eye /aɪ/
  - knee begins with a silent k
  - stomach has the source-highlighted pronunciation /ˈstʌmək/
  - foot /fʊt/ and tooth /tuːθ/
common_mistakes:
  - Usually use a possessive with a person's body part: "my leg", "her hair".
  - Foot -> feet and tooth -> teeth are irregular plurals.
  - Hair is treated as singular/mass in the source's ordinary description pattern.
examples:
  - My shoulder hurts after training.
  - She has long hair and blue eyes.
recognition_drills:
  - Match a body part to its irregular plural or pronunciation clue.
production_drills:
  - Translate a sentence about pain or washing a body part using the correct possessive.
speaking_drills:
  - Which parts of your body get tired after a long day at the computer?
related:
  - vocabulary.health-illness
