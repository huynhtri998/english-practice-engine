id: vocabulary.describing-people
title: Describing People
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [5]
source_coverage: Unit 5 appearance vocabulary for height, build, age, hair/skin and facial hair plus the question pattern "What does ... look like?" is represented.
core_concept: Describe appearance by combining a small number of dimensions: height, build, age, hair/skin and distinctive features.
mental_model: Build a description in layers instead of searching for one perfect adjective.
key_items:
  - tall
  - short
  - medium height
  - slim
  - thin
  - overweight
  - young
  - middle-aged
  - elderly
  - dark hair
  - fair/blonde hair
  - dark skin
  - beard
  - moustache
  - pretty
  - beautiful
  - good-looking
  - average-looking
collocations:
  - have short fair hair
  - have a beard/moustache
  - be tall and slim
  - What does somebody look like?
common_mistakes:
  - The source notes that asking whether somebody is elderly can be more polite than directly asking whether they are old.
examples:
  - He's medium height with short dark hair.
  - She has long fair hair and is quite tall.
recognition_drills:
  - Choose the best word for height, build, age or hair in a short description.
production_drills:
  - Describe a fictional person using at least three source categories.
speaking_drills:
  - What does one of your friends look like?
related:
  - vocabulary.clothes
  - vocabulary.body-parts
