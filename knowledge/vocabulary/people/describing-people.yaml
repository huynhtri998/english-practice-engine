id: vocabulary.describing-people
title: Describing People
kind: vocabulary
level: A1-A2
category: vocabulary.people
status: normalized-core
source_refs:
- source: eviu-elementary-3e
  units:
  - 5
source_coverage: Normalized core from the referenced source unit(s). The source book remains the detailed vocabulary
  reference; copied exercises and long source passages are not stored here.
core_concept: Core elementary vocabulary and useful chunks for describing people, with emphasis on natural combinations
  and active use.
mental_model: Retrieve the idea first, then recall the natural English word or chunk together with the words it
  normally combines with.
key_items:
- tall
- short
- medium height
- slim
- thin
- overweight
- fat
- dark skin
- fair skin
- blonde hair
- dark hair
- beard
- moustache
- beautiful
- pretty
- good-looking
- average-looking
- young
- middle-aged
- elderly
collocations:
- be 1.75 metres tall
- weigh 70 kilos
- What does ... look like?
common_mistakes:
- Use tall for people, not high.
- 'Hair is normally singular: blonde hair, not blonde hairs.'
recognition_drills:
- Create a fresh matching/choice item using the key vocabulary for Describing People; do not copy the source exercise.
production_drills:
- Give a short Vietnamese prompt that naturally requires vocabulary from Describing People, then wait for an English
  answer.
speaking_drills:
- Ask one short personal question that naturally elicits two or more items from Describing People.
