id: vocabulary.verb.get
title: 'Get: Core Uses'
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [45]
  - source: egiu-4e
    units: [56]
source_coverage: Both source units are represented: change with get + adjective, obtain/find with get + noun, get married, arrival/reach and get back/home/there patterns.
core_concept: Get has several high-frequency elementary meanings: become/change, obtain/find, arrive/reach and return.
mental_model: Identify the meaning first, then recall the matching get chunk.
key_items:
  - get dark
  - get better
  - get tired
  - get wet
  - get a stamp
  - get a job
  - get a taxi
  - get married
  - get to a place
  - get back
  - get home
  - get there
collocations:
  - get + adjective = become/change
  - get + noun = obtain/find
  - get to + ordinary place
  - get home/there without to
common_mistakes:
  - Say get home and get there, not get to home/get to there.
  - Keep get to before ordinary place names in the arrival meaning.
examples:
  - I'm getting tired.
  - I need to get a new passport.
  - What time did you get home?
recognition_drills:
  - Identify whether get means change, obtain, arrive or return in fresh sentences.
production_drills:
  - Make one sentence for each of three different get meanings.
speaking_drills:
  - What time do you usually get home from work?
related:
  - vocabulary.verb.go
  - grammar.prepositions-movement-to-in-at
