id: vocabulary.bring-vs-take
title: Bring vs Take
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [44]
source_coverage: Unit 44 directional contrast, bring somebody something and bring back are represented.
core_concept: Take moves something from here toward there; bring moves something from there toward here/reference destination.
mental_model: Pair take with go; pair bring with come.
key_items:
  - take something to a place/person
  - bring something here
  - bring somebody something
  - bring something back
collocations:
  - bring me a glass
  - bring your guitar
  - bring somebody flowers
  - take it and bring it back
common_mistakes:
  - Choose from the speaker/reference point, not from the object itself.
examples:
  - Take this document to reception, and bring the signed copy back.
recognition_drills:
  - Choose bring/take from directional scenarios.
production_drills:
  - Give paired instructions using take ... there and bring ... back here.
speaking_drills:
  - What do you usually take to work with you?
