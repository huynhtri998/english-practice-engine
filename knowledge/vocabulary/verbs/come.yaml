id: vocabulary.verb.come
title: Come: Core Uses
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [42]
source_coverage: Unit 42 come vs go direction, come in/out, come back/home/from/along and common usage warnings are represented.
core_concept: Come normally expresses movement toward the speaker/reference place; learn the high-frequency preposition/particle chunks around that viewpoint.
mental_model: Movement toward 'here' -> come; movement away toward 'there' -> go.
key_items:
  - come in
  - come out of
  - come back
  - come back from
  - come home
  - come from
  - come along
  - come and see
collocations:
  - come from + place
  - come back from + place
  - come home
  - come along with us
common_mistakes:
  - For origin, the source uses I come from Poland, not I'm coming from Poland.
examples:
  - I came back from the office late yesterday.
  - Do you want to come along?
recognition_drills:
  - Choose come/go from the speaker's viewpoint.
production_drills:
  - Create sentences using come in, come back, come from and come along.
speaking_drills:
  - What time do you normally come home from work?
