id: vocabulary.verb.take
title: Take: Core Uses and Collocations
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [43]
source_coverage: Unit 43 time-taken pattern, taking things with you, transport and common activity collocations are represented.
core_concept: Take appears in several high-frequency chunks: duration, carrying something away/with you, transport, photos, courses/exams and lessons.
mental_model: Do not translate take as one meaning; retrieve the whole chunk attached to the situation.
forms:
  duration: it takes + person + time + to + verb
key_items:
  - take an umbrella
  - take a photo
  - take a course
  - take an exam
  - take lessons
  - take the bus/train/underground
  - take a taxi
collocations:
  - How long does it take ...?
  - take something with you
  - take a photo
  - take an English course
  - take an exam
common_mistakes:
  - Learn take + transport/activity as fixed chunks rather than substituting make.
examples:
  - It takes me twenty minutes to get there.
  - I usually take the bus when it rains.
recognition_drills:
  - Match take-collocations to duration, transport, study or carrying meanings.
production_drills:
  - Answer three How long does it take...? prompts and use two other take chunks.
speaking_drills:
  - How long does it take you to get to work?
