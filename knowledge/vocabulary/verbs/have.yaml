id: vocabulary.verb.have
title: 'Have: Core Uses and Collocations'
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [38]
  - source: egiu-4e
    units: [58]
source_coverage: Both source units are represented: possession/health with have or have got, activity/meal/event collocations with have, past had and the restriction against have got for activity meanings.
core_concept: Have can express possession/state, where have got is often equivalent, and it also forms many fixed activity/event chunks where have got is not interchangeable.
mental_model: Possession/state -> have or have got; activity/experience -> learn have + noun chunk.
key_items:
  - have / have got a car/problem/cold
  - have breakfast/lunch/dinner
  - have a meal/drink
  - have a meeting/lesson/exam
  - have a shower/bath
  - have a rest/holiday/party
  - have a swim/walk/game
  - have a look
  - have a good time
  - have a word with
  - have time
  - have a baby
collocations:
  - have + meal/drink
  - have + event/activity
  - have your hair cut
common_mistakes:
  - Do not use have got for activity meanings such as having breakfast or a shower.
  - In the past, use had in the source possession pattern rather than had got.
examples:
  - I've got a new monitor, and I have lunch at my desk sometimes.
  - We had a meeting yesterday.
recognition_drills:
  - Decide where have got is possible and where only the activity use of have fits.
production_drills:
  - Make one possession sentence and two activity-collocation sentences with have.
speaking_drills:
  - What do you usually have for breakfast, and when do you usually have meetings?
related:
  - grammar.have-vs-have-got
  - grammar.have-to
