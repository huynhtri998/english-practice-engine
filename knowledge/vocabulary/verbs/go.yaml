id: vocabulary.verb.go
title: 'Go: Core Uses and Collocations'
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [39]
  - source: egiu-4e
    units: [55]
source_coverage: Both source units are represented: movement/place patterns, go + prepositions, go to/on/for chunks and go + -ing activities; exercises remain in the books.
core_concept: Go combines with different complements depending on meaning: go to + place, go on + event/trip, go for + selected noun activities, and go + -ing for many leisure activities.
mental_model: Learn the destination/activity as a whole chunk rather than adding one default preposition after go.
key_items:
  - go to work
  - go to university
  - go to the cinema
  - go on holiday
  - go on a trip/tour/cruise
  - go for a walk
  - go for a swim
  - go shopping
  - go swimming
  - go dancing
  - go sightseeing
  - go skiing
  - go fishing
  - go home
  - go there
  - go in/into
  - go out of
collocations:
  - go to + place
  - go on + holiday/trip/tour/cruise
  - go for + walk/swim
  - go + -ing for activities
common_mistakes:
  - Do not add to before home or there.
  - For activities such as swimming or shopping, use go + -ing rather than go to/for + -ing.
examples:
  - I go to work by car, but I go home on foot sometimes.
  - We went swimming and then went shopping.
recognition_drills:
  - Choose to, on, for or no preposition for a set of go-chunks.
production_drills:
  - Describe three things you did last weekend using different go patterns.
speaking_drills:
  - Where do you like to go on holiday, and what do you like doing there?
related:
  - grammar.future-going-to
  - vocabulary.holidays
