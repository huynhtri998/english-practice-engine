id: vocabulary.phrasal-verbs-basic
title: Basic Phrasal Verbs
kind: vocabulary
level: A1-A2
category: vocabulary.verbs
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [46]
  - source: egiu-4e
    units: [114]
source_coverage: EVIU Unit 46 and EGIU Unit 114 core verb-particle movement/state patterns are represented; separable-object order belongs to grammar.phrasal-verb-object-order.
core_concept: A common verb plus a short particle can form a new high-frequency chunk; learn each phrasal verb as a unit with its situation.
mental_model: Do not decode the particle alone; retrieve verb + particle as one lexical action.
key_items:
  - get up
  - get in / get out
  - get on / get off
  - put on
  - take off
  - turn on / turn off
  - turn down
  - go out / go in
  - come back / go back
  - stand up / sit down / lie down
  - fall down / fall off
  - run away
  - look out / look up / look round
collocations:
  - plane takes off
  - alarm goes off
  - turn the music down
  - get on/off a bus
  - get in/out of a car
common_mistakes:
  - Meaning depends on the whole phrasal verb; the same particle does not create one fixed meaning.
examples:
  - The alarm went off, so I got up quickly.
  - Please turn the music down.
recognition_drills:
  - Match common phrasal verbs to situations without translating particles separately.
production_drills:
  - Complete a short morning/travel story with six phrasal verbs.
speaking_drills:
  - What time do you get up, and what do you usually turn on first?
related: [grammar.phrasal-verb-object-order]
