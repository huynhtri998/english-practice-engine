id: vocabulary.common-adjectives
title: Common Adjectives for Good and Bad Things
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [56]
source_coverage: Unit 56 positive and negative adjective scales, spoken reactions, not bad and how + adjective reaction patterns are represented.
core_concept: Build a small expressive scale beyond good/bad and use the adjectives in natural spoken reactions.
mental_model: Positive/negative evaluation -> choose strength -> use as description or short reaction.
key_items:
  - good / nice / lovely / great / wonderful / excellent
  - bad / dreadful / horrible / terrible
  - perfect
  - awful
  - not bad
collocations:
  - a wonderful view
  - an excellent idea
  - a terrible day
  - dreadful weather / smell
  - How nice! / How wonderful! / How lovely!
  - How awful! / How horrible!
common_mistakes:
  - For a sympathetic negative reaction, the source uses How awful!/How horrible!, not How bad!.
examples:
  - That's an excellent idea.
  - The traffic was terrible, but the restaurant was lovely.
recognition_drills:
  - Sort adjectives by positive/negative meaning and approximate strength.
production_drills:
  - React naturally to four pieces of good or bad news.
speaking_drills:
  - Tell me about something great and something terrible from this week.
