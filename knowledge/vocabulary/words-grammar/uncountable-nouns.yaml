id: vocabulary.uncountable-nouns
title: Common Uncountable Nouns
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [55]
source_coverage: Unit 55 countability contrast, common everyday uncountables, food/drink uncountables, singular agreement and quantity-unit phrases are represented.
core_concept: Learn common uncountable nouns inside phrases that reveal their grammar rather than memorizing the noun alone.
mental_model: Store the noun with some/a piece of/a loaf of/etc. so countability becomes part of retrieval.
key_items:
  - money
  - luggage
  - traffic
  - furniture
  - news
  - advice
  - information
  - weather
  - accommodation
  - air
  - travel
  - work
  - rice / spaghetti / butter / bread / milk / water / tea / coffee
collocations:
  - some advice / information / luggage
  - useful information
  - bad news / weather / traffic
  - a loaf of bread
  - a litre of milk
  - a kilo of rice
common_mistakes:
  - Use singular agreement with source nouns such as news, furniture and accommodation.
  - Avoid plural forms such as informations, advices, furnitures and luggages in these source meanings.
  - Do not use a/an directly before these uncountables; use a unit expression when needed.
examples:
  - I need some information about the accommodation.
  - The news is good, but the traffic is terrible.
recognition_drills:
  - Identify countability mistakes and choose natural quantity phrases.
production_drills:
  - Correct a short paragraph containing plural/article errors with uncountable nouns.
speaking_drills:
  - What information and luggage do you need before a trip?
related: [grammar.countable-uncountable]
