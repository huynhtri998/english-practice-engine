id: vocabulary.uncountable-nouns
title: Common Uncountable Nouns
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: normalized-core
source_refs:
- source: eviu-elementary-3e
  units:
  - 55
source_coverage: Normalized core from the referenced source unit(s). The source book remains the detailed vocabulary
  reference; copied exercises and long source passages are not stored here.
core_concept: Core elementary vocabulary and useful chunks for common uncountable nouns, with emphasis on natural
  combinations and active use.
mental_model: Retrieve the idea first, then recall the natural English word or chunk together with the words it
  normally combines with.
key_items:
- traffic
- furniture
- advice
- information
- news
- weather
- accommodation
- air
- travel
- work
- rice
- spaghetti
- butter
- bread
- milk
- water
- tea
- coffee
- sugar
- money
- luggage
collocations:
- some advice/information/news
- bad traffic/weather
- fresh air
- hard work
- a loaf of bread
- a litre of milk
common_mistakes:
- Do not normally pluralize uncountable nouns such as luggage, furniture, advice, information or news.
recognition_drills:
- Create a fresh matching/choice item using the key vocabulary for Common Uncountable Nouns; do not copy the source
  exercise.
production_drills:
- Give a short Vietnamese prompt that naturally requires vocabulary from Common Uncountable Nouns, then wait for
  an English answer.
speaking_drills:
- Ask one short personal question that naturally elicits two or more items from Common Uncountable Nouns.
