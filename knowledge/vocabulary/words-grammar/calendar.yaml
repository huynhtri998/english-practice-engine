id: vocabulary.calendar
title: Days, Months and Seasons
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [51]
source_coverage: Unit 51 calendar units, days, months, seasons, weekend/yesterday/today/tomorrow and core on/at/in calendar chunks are represented.
core_concept: Retrieve calendar vocabulary together with capitalization and the common time prepositions used with days, weekends, months and seasons.
mental_model: Time scale -> correct word -> normal preposition/capitalization chunk.
key_items:
  - day / week / fortnight / month / year / century
  - Sunday through Saturday
  - January through December
  - spring / summer / autumn / winter
  - yesterday / today / tomorrow
  - morning / afternoon / evening
  - weekend
collocations:
  - on Monday / on Tuesday evening
  - at the weekend
  - in July / in winter
  - leap year
common_mistakes:
  - Days and months begin with capital letters; seasons normally do not.
  - The source uses at the weekend, not in the weekend.
  - Use in + month, for example in July.
examples:
  - I usually study English at the weekend and more often in summer.
recognition_drills:
  - Correct capitalization and prepositions in calendar expressions.
production_drills:
  - Say today's day/month/season and describe one regular calendar event.
speaking_drills:
  - Which day of the week is usually busiest for you?
