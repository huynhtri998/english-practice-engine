id: vocabulary.time-words
title: Time Words
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [52]
source_coverage: Unit 52 now/then, ago/last/next, past-present-future, frequency adverbs, frequency-count expressions and short-time phrases are represented.
core_concept: Use a small set of time and frequency words to locate events relative to now and say how often they happen.
mental_model: First choose timeline position (past/now/future), then frequency if needed.
key_items:
  - now / then
  - ago
  - last / next
  - past / present / future
  - always / usually / often / sometimes / occasionally / rarely / never
  - now and then
  - once / twice / three times
  - soon / recently
  - at the moment / in a moment
collocations:
  - two hours ago
  - last week / next month
  - once a week / twice a day / three times a year
  - at the moment
  - in a moment
common_mistakes:
  - Keep at the moment ('now') distinct from in a moment ('very soon').
examples:
  - I practise speaking twice a week at the moment.
  - I changed jobs two years ago.
recognition_drills:
  - Place time words on a past-now-future line and match frequency expressions.
production_drills:
  - Answer how-often prompts with once/twice/times and an appropriate period.
speaking_drills:
  - How often do you practise English at the moment?
