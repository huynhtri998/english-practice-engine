id: vocabulary.connecting-words
title: Conjunctions and Connecting Words
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [50]
source_coverage: Unit 50 basic conjunction meanings and the additional connecting words only, like, than, also, too and as well are represented.
core_concept: Small connecting words encode addition, contrast, alternatives, reason, result, time, condition, limitation and comparison.
mental_model: Before choosing the word, name the relationship between the two ideas.
key_items:
  - and
  - but
  - or
  - because
  - so
  - when
  - before
  - after
  - if
  - only
  - like
  - than
  - also
  - too
  - as well
collocations:
  - comparative + than
  - look like
  - also/too/as well for extra information
  - because + reason
  - so + result
common_mistakes:
  - Like introduces comparison here; than follows comparative forms.
  - Also, too and as well share an addition meaning but normally occupy different sentence positions.
examples:
  - I study English because I use it at work, and I practise speaking as well.
recognition_drills:
  - Choose a connector by relationship and identify reason versus result.
production_drills:
  - Link six pairs of ideas with different source connectors.
speaking_drills:
  - Why are you learning English, and what else are you studying as well?
