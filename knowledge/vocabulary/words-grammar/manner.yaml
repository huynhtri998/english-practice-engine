id: vocabulary.manner
title: Manner
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [54]
source_coverage: Unit 54 fast/slow, loud/quiet, good/bad, right/wrong and in a friendly/unfriendly way adjective-adverb contrasts are represented.
core_concept: Describe a thing/person with an adjective and describe how an action is done with the corresponding adverb or manner phrase.
mental_model: What is it like? -> adjective. How is the action done? -> adverb/manner phrase.
key_items:
  - fast / slowly
  - loud / loudly
  - quiet / quietly
  - good / well
  - bad / badly
  - right / wrong
  - in a friendly way / in an unfriendly way
collocations:
  - drive well / badly
  - speak loudly / quietly
  - the right way / the wrong way
common_mistakes:
  - Good describes a noun/person; well commonly describes the action: a good speaker, speaks well.
examples:
  - She explains difficult topics clearly and speaks quietly.
recognition_drills:
  - Choose adjective/adverb forms in manner contexts.
production_drills:
  - Describe how you do five familiar activities.
speaking_drills:
  - What do you think you do well in English?
