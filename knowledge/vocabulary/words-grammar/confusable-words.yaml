id: vocabulary.confusable-words
title: Words You May Confuse
kind: vocabulary
level: A1-A2
category: vocabulary.words-grammar
status: normalized-core
source_refs:
- source: eviu-elementary-3e
  units:
  - 60
source_coverage: Normalized core from the referenced source unit(s). The source book remains the detailed vocabulary
  reference; copied exercises and long source passages are not stored here.
core_concept: Core elementary vocabulary and useful chunks for words you may confuse, with emphasis on natural combinations
  and active use.
mental_model: Retrieve the idea first, then recall the natural English word or chunk together with the words it
  normally combines with.
key_items:
- quite
- quiet
- lose
- loose
- fell
- felt
- cook
- cooker
- lend
- borrow
- check
- control
- hope
- expect
- afternoon
- evening
- night
confusions:
- quite = fairly; quiet = not noisy
- lose = fail to find; loose = not tight
- fell = past of fall; felt = past of feel
- cook = person; cooker = appliance
- lend = give temporarily; borrow = receive temporarily
- check = inspect; control = direct/manage
- hope = want something to happen; expect = think it is probable
recognition_drills:
- Create a fresh matching/choice item using the key vocabulary for Words You May Confuse; do not copy the source
  exercise.
production_drills:
- Give a short Vietnamese prompt that naturally requires vocabulary from Words You May Confuse, then wait for an English
  answer.
speaking_drills:
- Ask one short personal question that naturally elicits two or more items from Words You May Confuse.
