id: vocabulary.countryside
title: In the Countryside
kind: vocabulary
level: A1-A2
category: vocabulary.world
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [30]
source_coverage: Unit 30 countryside landscape, rural living/work, nature/conservation and countryside activities are represented.
core_concept: Describe rural places, natural features, countryside work and outdoor activities with the source's key distinctions.
mental_model: Landscape -> settlement/work -> nature/wildlife -> activity.
key_items:
  - mountain
  - forest
  - hill
  - village
  - wood
  - lake
  - field
  - path
  - river
  - farm
  - country road
  - cottage
  - nature
  - wildlife
  - conservation area
  - national park
collocations:
  - live in a village
  - live on a farm
  - work in the fields
  - wildlife in the area
  - have a picnic
  - go walking / skiing in the mountains
common_mistakes:
  - Nature is not normally used as a place noun in the source patterns: say I love nature, but walk in the countryside.
  - Countryside/country can mean the area outside cities; country can also mean a nation.
examples:
  - My grandparents live in a small village near a river.
  - We went walking in the countryside and had a picnic.
recognition_drills:
  - Distinguish countryside, country and nature in short contexts.
production_drills:
  - Describe a rural place using at least five source items.
speaking_drills:
  - Do you prefer the city or the countryside, and why?
