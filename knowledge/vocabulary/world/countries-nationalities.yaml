id: vocabulary.countries-nationalities
title: Countries and Nationalities
kind: vocabulary
level: A1-A2
category: vocabulary.world
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [27]
source_coverage: Unit 27 continents, sample countries, nationality adjective patterns and language links are represented.
core_concept: Connect continent, country, nationality adjective and language, while preserving capitalization and irregular forms.
mental_model: Place name -> people/adjective -> language; learn common ending patterns but store exceptions separately.
key_items:
  - North America
  - South America
  - Europe
  - Asia
  - Africa
  - Australia
  - Antarctica
  - the UK
  - the USA / the US
  - Spain
  - China
  - Japan
  - Thailand
  - Brazil
  - Morocco
collocations:
  - the capital of ...
  - speak Spanish / Portuguese / German / Arabic / Chinese
  - American / Argentinian / Australian
  - British / English / Polish / Spanish
  - Chinese / Japanese / Portuguese
common_mistakes:
  - Country, continent, nationality and language names begin with capital letters.
  - Many languages use the same form as the nationality adjective, but Arabic is one source exception noted explicitly.
examples:
  - Madrid is the capital of Spain.
  - In Brazil people speak Portuguese.
recognition_drills:
  - Match countries to nationality/language forms and identify capitalization errors.
production_drills:
  - Give the country, nationality and main language for five familiar places.
speaking_drills:
  - Which countries have you visited, and what languages are spoken there?
