id: vocabulary.weather
title: Weather
kind: vocabulary
level: A1-A2
category: vocabulary.world
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [28]
source_coverage: Unit 28 weather nouns, adjective/verb forms, temperature/extreme-weather words and everyday weather questions are represented.
core_concept: Talk about current and typical weather using noun/adjective/verb families and common weather expressions.
mental_model: Weather phenomenon -> adjective/verb form -> temperature/intensity -> opinion/activity.
key_items:
  - sun
  - rain
  - snow
  - cloud
  - fog
  - wind
  - thunder
  - lightning
  - sunny
  - rainy
  - windy
  - cloudy
  - snowy
  - foggy
  - hot
  - cold
  - wet
  - dry
  - hurricane
  - storm
  - thunderstorm
collocations:
  - the sun is shining
  - it is raining / snowing
  - a sunny day
  - strong wind
  - weather forecast
  - minus 10 degrees
common_mistakes:
  - Use windy/cloudy/foggy/sunny, not winding/clouding/fogging/sunning for weather adjectives.
examples:
  - It's cloudy now, but the sun may come out later.
  - We sometimes have thunderstorms in summer.
recognition_drills:
  - Convert weather nouns to adjective/verb forms and choose the natural expression.
production_drills:
  - Describe today's weather and your typical summer weather in three sentences.
speaking_drills:
  - What's the weather like where you are today?
