id: vocabulary.school-university
title: At School and University
kind: vocabulary
level: A1-A2
category: vocabulary.work-study
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [15]
source_coverage: Unit 15 subjects, classroom objects and study/exam/course/degree expressions are represented with the source's homework error warning.
core_concept: Learn education vocabulary as subject + classroom item + study/exam action chunks.
mental_model: What are you studying? What do you use? What result are you working toward?
key_items:
  - English
  - maths
  - history
  - geography
  - biology
  - art
  - physics
  - chemistry
  - music
  - PE
  - ICT
  - board
  - noticeboard
  - pencil
  - notebook
  - textbook
  - ruler
  - whiteboard
  - computer
  - course
  - exam
  - degree
collocations:
  - teach maths
  - study maths
  - go to school
  - go to university
  - learn to read and write
  - do a course
  - take/do an exam
  - pass an exam
  - fail an exam
  - get a degree
  - do homework
common_mistakes:
  - Say "do homework", not "make homework" and not "do homeworks".
examples:
  - I'm doing an English course.
  - I hope to pass the exam and get a certificate.
recognition_drills:
  - Choose the natural verb with homework, course, exam and degree.
production_drills:
  - Describe one course you have done and one exam you passed or failed.
speaking_drills:
  - What subject did you enjoy most at school?
related:
  - vocabulary.jobs
  - vocabulary.collocation.do-vs-make
