id: vocabulary.communications
title: Communications
kind: vocabulary
level: A1-A2
category: vocabulary.work-study
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [16]
source_coverage: Unit 16 letters, email/internet, telephone/mobile vocabulary and phone-message expressions are represented.
core_concept: Learn communication vocabulary by channel: post, email/internet and phone/mobile.
mental_model: Choose the channel, then retrieve the action/object chunk used with it.
key_items:
  - address
  - stamp
  - date
  - envelope
  - letter
  - letter box
  - computer screen
  - keyboard
  - mouse
  - laptop
  - memory stick
  - email address
  - mobile device
  - phone number
  - voicemail
  - text message
collocations:
  - put a stamp on an envelope
  - post a letter
  - get an email
  - make a phone call
  - phone somebody
  - turn a smartphone off
  - leave a voicemail
  - send somebody a text
  - Can I speak to ...?
  - Can I take a message?
  - call back later
pronunciation_notes:
  - Email addresses use at for @ and dot for . in the source model.
  - Phone numbers may use oh for zero and double + digit for repeated digits.
examples:
  - I'll leave a voicemail and call back later.
  - What's your email address?
recognition_drills:
  - Match communication actions to letter, email or phone contexts.
production_drills:
  - Leave a short original phone message for a colleague.
speaking_drills:
  - How do you usually communicate with your team at work?
related:
  - vocabulary.phone
  - vocabulary.say-tell-ask
