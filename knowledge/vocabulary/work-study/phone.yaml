id: vocabulary.phone
title: Your Phone
kind: vocabulary
level: A1-A2
category: vocabulary.work-study
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [17]
source_coverage: Unit 17 phone vocabulary is represented around apps, screen/device controls, messages, photos/selfies and common phone actions; detailed source illustrations remain in the book.
core_concept: Learn phone vocabulary as action chunks for controlling the device, using apps, messaging and managing photos/files.
mental_model: What are you doing on the phone? Retrieve verb + phone object together.
key_items:
  - app
  - screen
  - SIM card
  - power button
  - voicemail
  - text
  - selfie
  - password
collocations:
  - download an app
  - swipe the screen
  - save a photo/file
  - delete a photo/file
  - take a selfie
  - leave a voicemail
  - send a text
  - turn the phone on/off
examples:
  - I downloaded a new app yesterday.
  - I deleted some old photos from my phone.
recognition_drills:
  - Choose the natural phone action: download, swipe, save, delete or take.
production_drills:
  - Explain three things you did on your phone today using verb + object chunks.
speaking_drills:
  - Which apps do you use most on your phone?
related:
  - vocabulary.communications
  - vocabulary.online-shopping
