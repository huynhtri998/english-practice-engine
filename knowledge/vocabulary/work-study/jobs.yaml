id: vocabulary.jobs
title: Jobs
kind: vocabulary
level: A1-A2
category: vocabulary.work-study
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [14]
source_coverage: Unit 14 common jobs, workplaces and the personal question "What do you do?" are represented.
core_concept: Learn job names with the workplace or main activity they typically connect to.
mental_model: Person -> job -> workplace/work activity.
key_items:
  - teacher
  - doctor
  - waiter
  - secretary
  - shop assistant
  - hairdresser
  - nurse
  - farmer
  - taxi driver
  - engineer
  - mechanic
  - police officer
  - librarian
  - bank clerk
  - factory
  - office
  - hospital
  - restaurant
  - school
collocations:
  - work in a hospital
  - work in an office
  - work in a restaurant
  - work in a factory
  - build roads and bridges
  - What do you do?
common_mistakes:
  - With a singular job, English normally uses a/an: "She's a doctor."
examples:
  - I'm a software engineer and I work in technology.
  - A waiter works in a restaurant or café.
recognition_drills:
  - Match a job to its likely workplace or activity.
production_drills:
  - Answer "What do you do?" and describe where you work.
speaking_drills:
  - What do you do, and what do you like about your job?
related:
  - vocabulary.school-university
  - grammar.articles-a-an
