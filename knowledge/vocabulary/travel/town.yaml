id: vocabulary.town
title: In the Town
kind: vocabulary
level: A1-A2
category: vocabulary.travel
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [29]
source_coverage: Unit 29 town places, public notices and simple direction/finding-place language are represented.
core_concept: Name common town places and use practical chunks to ask where something is, find services and understand simple notices.
mental_model: Need/service -> place -> location phrase -> direction/notice.
key_items:
  - bus station
  - railway station
  - tourist information office
  - bank
  - car park
  - museum
  - shopping centre
  - post office
  - town hall
  - library
  - pedestrian area
  - cash machine
  - entrance
  - exit
collocations:
  - on the left
  - on the other side of the road
  - take the number 14 bus
  - get a map
  - tell me the way to ...
  - look for a car park
  - out of order
  - no smoking
common_mistakes:
  - Learn direction chunks as whole phrases: on the left, at the end of the road, on the other side of the road.
examples:
  - Can you tell me the way to the railway station?
  - The cash machine at the bank is out of order.
recognition_drills:
  - Match needs to town places and interpret five common notices.
production_drills:
  - Give simple directions between two places in a town.
speaking_drills:
  - Tell me where the nearest bank, post office or station is in your town.
