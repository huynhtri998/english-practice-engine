id: vocabulary.movement-verbs
title: Moving
kind: vocabulary
level: A1-A2
category: vocabulary.travel
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [49]
source_coverage: Unit 49 movement/action verbs, ride/drive/take/go by transport distinctions and common irregular past forms are represented.
core_concept: Distinguish movement by body/action from operating/riding/taking transport and learn the frequent verb-object combinations.
mental_model: How are you moving? on foot/body action, riding, operating, or using transport as a passenger.
key_items:
  - run
  - walk
  - swim
  - climb
  - fall
  - jump
  - dance
  - ride
  - drive
  - fly
  - carry
  - miss
collocations:
  - ride a bicycle/motorbike/horse
  - drive a car/lorry/train
  - take a bus/taxi/underground
  - go by car/bus/train/plane
  - walk to work
  - go swimming/climbing/dancing
common_mistakes:
  - With by + transport, omit a/the in the source pattern: by car, by taxi.
examples:
  - I usually walk to work, but sometimes I take a taxi.
recognition_drills:
  - Choose ride/drive/take/go by for different transport.
production_drills:
  - Describe how you travelled yesterday using past forms of three movement verbs.
speaking_drills:
  - How do you usually travel around your city?
