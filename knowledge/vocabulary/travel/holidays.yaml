id: vocabulary.holidays
title: Holidays
kind: vocabulary
level: A1-A2
category: vocabulary.travel
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [18]
source_coverage: Unit 18 covers types of holidays, transport, travel documents/money/luggage and basic holiday expressions.
core_concept: Organise holiday vocabulary around type of trip, transport, what to take and what to do at the destination.
mental_model: Plan the trip in four steps: holiday type -> transport -> essentials -> activities.
key_items:
  - holiday
  - package holiday
  - winter holiday
  - camping
  - walking holiday
  - coach tour
  - plane
  - train
  - car
  - ferry
  - coach
  - passport
  - visa
  - ticket
  - currency
  - camera
  - luggage
  - suitcase
  - rucksack
  - local food
  - nightlife
  - postcard
collocations:
  - be on holiday
  - go on holiday
  - go on a package holiday
  - go camping
  - go by ferry/train/plane
  - take your passport
  - try the local food
  - enjoy the nightlife
  - send a postcard
  - Have a great time!
examples:
  - We're going on holiday by train this summer.
  - Don't forget to take your passport and some currency.
recognition_drills:
  - Sort holiday words into transport, documents, luggage and activities.
production_drills:
  - Plan a short holiday using at least five unit chunks.
speaking_drills:
  - What kind of holiday do you enjoy most?
related:
