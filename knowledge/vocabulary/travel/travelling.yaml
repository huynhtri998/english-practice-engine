id: vocabulary.travelling
title: Travelling
kind: vocabulary
level: A1-A2
category: vocabulary.travel
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [32]
source_coverage: Unit 32 transport, ticket/reservation language, train/plane processes and car travel expressions are represented.
core_concept: Use travel vocabulary as process chunks for booking, boarding, changing transport, arriving and local movement.
mental_model: Plan/book -> station/airport -> board -> travel -> arrive/customs -> local transport.
key_items:
  - train
  - bus
  - taxi
  - plane
  - underground
  - map
  - timetable
  - customs
  - luggage
  - passport
  - single ticket
  - return ticket
  - platform
  - boarding card
collocations:
  - book/reserve a seat in advance
  - change trains
  - direct train
  - check in
  - take off / land
  - go through customs
  - hire a car
  - fill up with petrol
  - give someone a lift
common_mistakes:
  - Source says Was the journey long?, not Was the travel long?.
  - Passport officers check passports; control has a different use.
examples:
  - We booked a return ticket and reserved seats in advance.
recognition_drills:
  - Order the steps of a train or plane journey.
production_drills:
  - Ask for a ticket and explain one connection/change.
speaking_drills:
  - How do you usually travel between cities?
