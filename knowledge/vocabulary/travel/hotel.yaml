id: vocabulary.hotel
title: In a Hotel
kind: vocabulary
level: A1-A2
category: vocabulary.travel
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [21]
source_coverage: Unit 21 hotel places, room types, reception language and service questions are represented; source exercises remain in the book.
core_concept: Use a compact set of hotel nouns and service chunks to book, arrive, ask for help and check out naturally.
mental_model: Think through the guest journey: reservation -> reception -> room/services -> bill/check-out.
key_items:
  - reception
  - lift
  - key
  - luggage
  - bill
  - mini-bar
  - hairdryer
  - single room
  - double room
  - reservation
  - room service
  - wake-up call
collocations:
  - have a reservation
  - a room with a view
  - fill in a form
  - sign your name
  - help with your luggage
  - check the bill
  - check out
  - order room service
  - have breakfast in your room
  - exchange some money
common_mistakes:
  - Use check out when leaving the hotel; check the bill means make sure it is correct.
  - Use a single room for one person and a double room for two people.
examples:
  - I have a reservation for a double room.
  - Could I have a wake-up call at six thirty?
recognition_drills:
  - Choose the best hotel expression for four guest situations.
production_drills:
  - Give a short Vietnamese hotel request and wait for an English response.
speaking_drills:
  - Role-play checking in, asking one service question, and checking out.
