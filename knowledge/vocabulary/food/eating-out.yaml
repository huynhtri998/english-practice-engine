id: vocabulary.eating-out
title: Eating Out
kind: vocabulary
level: A1-A2
category: vocabulary.food
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [22]
source_coverage: Unit 22 places to eat, meal-course vocabulary, ordering language and bill language are represented; source exercises remain in the book.
core_concept: Use restaurant vocabulary as chunks for choosing a place, ordering courses, describing food and paying.
mental_model: Place -> menu -> order -> food preference -> bill.
key_items:
  - cafe
  - restaurant
  - pub
  - take-away
  - snack
  - meal
  - starter
  - main course
  - dessert
  - menu
  - steak
  - salad
  - curry
  - bill
collocations:
  - serve a meal
  - ready to order
  - I'd like ...
  - rare / medium / well-done
  - have a starter
  - have the main course
  - Could I have the bill?
common_mistakes:
  - Use bill for the amount to pay in a restaurant in British English.
  - Use I'd like + noun to order politely.
examples:
  - I'd like the curry for my main course.
  - Could we have the bill, please?
recognition_drills:
  - Put restaurant stages in order and choose the natural phrase for each stage.
production_drills:
  - Translate one short restaurant request from Vietnamese to English.
speaking_drills:
  - Order a starter, main course and drink in a short role-play.
