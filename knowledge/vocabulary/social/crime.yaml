id: vocabulary.crime
title: Crime
kind: vocabulary
level: A1-A2
category: vocabulary.social
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [34]
source_coverage: Unit 34 common crimes/criminals, steal vs rob, arrest, guilt/innocence, fines and prison are represented.
core_concept: Learn crime nouns together with the person/action and basic justice outcome vocabulary.
mental_model: Crime/action -> criminal -> police action -> court/outcome.
key_items:
  - murderer
  - burglar
  - robber
  - shoplifter
  - mugger
  - drug dealer
  - vandal
  - terrorist
  - arrest
  - guilty
  - innocent
  - fine
  - prison
collocations:
  - steal something
  - rob a person/place
  - pay a fine
  - go to prison
common_mistakes:
  - Keep steal something distinct from rob somebody/somewhere.
examples:
  - The police arrested the burglar.
recognition_drills:
  - Match crimes to criminals and choose steal/rob.
production_drills:
  - Describe a simple crime scenario using four source words.
speaking_drills:
  - What should happen when someone steals something from a shop?
