id: vocabulary.problems-home-work
title: Problems at Home and Work
kind: vocabulary
level: A1-A2
category: vocabulary.social
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [36]
source_coverage: Unit 36 common household problems, minor injuries/social issues and workplace problems are represented.
core_concept: Describe everyday problems and pair them with practical action verbs.
mental_model: Problem state -> likely cause/impact -> action to fix/respond.
key_items:
  - broken
  - not working
  - dying plants
  - untidy
  - lost keys
  - cut finger
  - row
  - apologise
  - late for work
  - too much work
  - colleague
  - in a bad mood
  - computer crashed
  - out of order
collocations:
  - mend / repair something
  - water the plants
  - tidy a room
  - look for keys
  - put on a plaster
  - have a row
  - apologise to someone
common_mistakes:
  - Learn broken/not working/out of order as different but related problem descriptions.
examples:
  - My laptop crashed and the printer was out of order.
recognition_drills:
  - Match common problems with the most natural action.
production_drills:
  - Describe three problems from a bad workday.
speaking_drills:
  - What do you do when your computer crashes at work?
