recognition_drills:
- Create a fresh matching/choice item using the key vocabulary for Global Problems; do not copy the source exercise.
production_drills:
- Give a short Vietnamese prompt that naturally requires vocabulary from Global Problems, then wait for an English
  answer.
speaking_drills:
- Ask one short personal question that naturally elicits two or more items from Global Problems.
