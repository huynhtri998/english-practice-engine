id: vocabulary.global-problems
title: Global Problems
kind: vocabulary
level: A1-A2
category: vocabulary.social
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [37]
source_coverage: Unit 37 disasters, traffic/pollution, political problems and adjectives for affected people are represented.
core_concept: Name common large-scale environmental, social and political problems using frequent word partnerships.
mental_model: Problem type -> event/condition -> affected people/place.
key_items:
  - hurricane
  - flood
  - earthquake
  - snowstorm
  - forest fire
  - war
  - strike
  - traffic jam
  - car crash
  - air pollution
  - rush hour
  - crowded
  - homeless
  - unemployed
  - hungry
  - polluted
collocations:
  - forest fire
  - traffic jam
  - car crash
  - rush hour
  - go on strike
  - air pollution
common_mistakes:
  - Learn compound problem terms as fixed chunks rather than translating word by word.
examples:
  - Traffic jams make air pollution worse in many cities.
recognition_drills:
  - Match compound nouns and categorize road/weather/political/social problems.
production_drills:
  - Summarize one city problem and one natural disaster using source vocabulary.
speaking_drills:
  - What's a major problem in big cities where you live?
