id: vocabulary.media
title: The Media
kind: vocabulary
level: A1-A2
category: vocabulary.social
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [35]
source_coverage: Unit 35 TV/radio programmes, newspapers/magazines, adverts and media jobs are represented.
core_concept: Talk about media types, programme genres, publications and people who create/report news.
mental_model: Medium -> content type -> person -> viewing/reading habit.
key_items:
  - news
  - soap opera
  - nature programme
  - documentary
  - talk show
  - cartoon
  - reality TV
  - sports programme
  - newspaper
  - magazine
  - advert / advertisement
  - interview
  - reporter
  - journalist
  - channel
collocations:
  - watch TV online
  - read newspapers online
  - change the channel
  - an interview with ...
common_mistakes:
  - The news takes singular agreement in the source: The news is on now.
examples:
  - I watched a documentary online last night.
recognition_drills:
  - Match programme types to descriptions and media jobs to roles.
production_drills:
  - Describe your media habits using four source items.
speaking_drills:
  - What's your favourite kind of TV or online programme?
