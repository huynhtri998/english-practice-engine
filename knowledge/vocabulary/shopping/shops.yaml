id: vocabulary.shopping
title: Shops and Shopping
kind: vocabulary
level: A1-A2
category: vocabulary.shopping
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [19]
source_coverage: Unit 19 shop types, department-store shopping, trying clothes, size/colour requests and payment/receipt/change language are represented.
core_concept: Learn shopping vocabulary as a sequence: find the shop/item, try/choose it, then pay and handle the receipt/change.
mental_model: Shopping journey from shelf to payment.
key_items:
  - chemist's
  - department store
  - post office
  - gift shop
  - shop assistant
  - size
  - colour
  - price
  - cash
  - credit card
  - debit card
  - change
  - receipt
  - carrier bag
collocations:
  - go shopping
  - try something on
  - a bigger/smaller size
  - a different colour
  - pay by credit/debit card
  - pay in cash
  - keep the receipt
examples:
  - Can I try this jacket on?
  - Do you have this in a smaller size?
recognition_drills:
  - Choose the natural phrase for trying clothes, requesting size or paying.
production_drills:
  - Role-play buying a piece of clothing and asking for a different size.
speaking_drills:
  - Do you prefer paying by card or in cash?
related:
  - vocabulary.online-shopping
  - vocabulary.clothes
