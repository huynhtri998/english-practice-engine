id: vocabulary.online-shopping
title: Online Shopping
kind: vocabulary
level: A1-A2
category: vocabulary.shopping
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [20]
source_coverage: Unit 20 online-search/review/basket/payment/delivery workflow plus address, post code and order-number language are represented.
core_concept: Learn online-shopping vocabulary as a process from search and reviews to basket, payment, order tracking and delivery.
mental_model: Search -> compare/read reviews -> add to basket -> pay -> receive delivery.
key_items:
  - search
  - price
  - online review
  - size
  - basket
  - delivery
  - delivery address
  - post code
  - credit card
  - order number
  - next-day delivery
collocations:
  - shop online
  - search for the best price
  - read online reviews
  - add something to your basket
  - delete something from your basket
  - pay by/with credit card
  - pay for delivery
  - wait for a delivery
  - choose next-day delivery
common_mistakes:
  - Use search for when looking for a product/price in the unit pattern.
  - An order number identifies the order; a post code belongs to the delivery address.
examples:
  - I read the reviews before I added the headphones to my basket.
  - What's your order number and delivery address?
recognition_drills:
  - Put the online-shopping actions in a natural order from search to delivery.
production_drills:
  - Explain how you buy something online using at least five process chunks.
speaking_drills:
  - Do you usually read reviews before you buy something online?
related:
  - vocabulary.shopping
  - vocabulary.phone
