id: vocabulary.food-drink
title: Food and Drink
kind: vocabulary
level: A1-A2
category: vocabulary.home
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [10]
source_coverage: Unit 10 everyday food, fast food, fruit/vegetables, drinks and the source's countability warnings for bread and fruit are represented.
core_concept: Learn common food/drink vocabulary together with basic countability and natural eating/drinking chunks.
mental_model: Picture a meal or supermarket category and retrieve the whole food/drink phrase.
key_items:
  - bread
  - rice
  - pasta
  - salt
  - pepper
  - meat
  - fish
  - hamburger
  - hot dog
  - pizza
  - fish and chips
  - carrots
  - beans
  - potatoes
  - tomatoes
  - peas
  - onions
  - garlic
  - mushrooms
  - apple
  - pineapple
  - orange
  - banana
  - pear
  - strawberries
  - grapes
  - mineral water
  - tea
  - coffee
  - milk
  - fruit juice
collocations:
  - some bread
  - eat meat/fish
  - put salt on food
  - take sugar in tea or coffee
  - fruit and vegetables
common_mistakes:
  - Say "some bread" or a piece/slice of bread, not "a bread" for the ordinary uncountable use taught here.
  - Fruit is treated as singular/uncountable in the unit's general statement pattern: "I love fruit".
examples:
  - I usually have rice and vegetables for lunch.
  - Do you take sugar in your coffee?
recognition_drills:
  - Choose the natural countability pattern for bread or fruit in a fresh sentence.
production_drills:
  - Describe a simple meal using at least four unit words.
speaking_drills:
  - What do you usually eat for lunch?
related:
  - vocabulary.kitchen
  - vocabulary.eating-out
  - vocabulary.uncountable-nouns
