id: vocabulary.bedroom-bathroom
title: Bedroom and Bathroom
kind: vocabulary
level: A1-A2
category: vocabulary.home
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [12]
source_coverage: Unit 12 bedroom/bathroom objects and everyday routines such as getting dressed, having a bath/shower and turning off the light are represented.
core_concept: Learn bedroom and bathroom objects together with the routines performed with them.
mental_model: Room -> object -> routine.
key_items:
  - bed
  - wardrobe
  - mirror
  - hairbrush
  - comb
  - bedside lamp
  - bedside table
  - alarm clock
  - chest of drawers
  - dressing table
  - pyjamas
  - bath
  - shower
  - toilet
  - basin
  - soap
  - shower gel
  - shampoo
  - toothbrush
  - toothpaste
  - razor
collocations:
  - get dressed
  - get undressed
  - have a bath
  - have a shower
  - wash your face
  - clean your teeth
  - turn off the light
  - wake up
  - get up
examples:
  - My alarm clock is on the bedside table.
  - I usually have a shower before I get dressed.
recognition_drills:
  - Match an everyday routine to the bedroom/bathroom object normally used.
production_drills:
  - Describe your morning routine using at least four unit chunks.
speaking_drills:
  - What do you usually do first after you wake up?
related:
  - vocabulary.everyday-actions
  - vocabulary.clothes
