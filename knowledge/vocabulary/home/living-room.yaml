id: vocabulary.living-room
title: In the Living Room
kind: vocabulary
level: A1-A2
category: vocabulary.home
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [13]
source_coverage: Unit 13 living-room furniture/equipment and source-highlighted collocation/countability errors are represented.
core_concept: Learn living-room objects together with the verbs naturally used with them.
mental_model: Picture the room and retrieve object + action pairs.
key_items:
  - bookshelf
  - sofa
  - coffee table
  - picture
  - light switch
  - hi-fi
  - carpet
  - rug
  - remote control
  - lamp
  - armchair
  - curtains
  - radio
  - socket
  - furniture
collocations:
  - switch on the TV
  - relax in an armchair
  - close the curtains
  - pass the remote control
  - listen to the radio
  - watch television
common_mistakes:
  - Say "listen to the radio", not "listen the radio".
  - Say "watch television/TV", not "watch at television".
  - The plural is bookshelves, not bookshelfs.
  - Furniture is uncountable in the unit pattern, not furnitures.
examples:
  - We need another bookshelf in the living room.
  - Please close the curtains; it's dark outside.
recognition_drills:
  - Correct a fresh sentence containing a living-room collocation or countability error.
production_drills:
  - Describe a simple living room and what you do there.
speaking_drills:
  - What do you usually do in your living room?
related:
  - vocabulary.kitchen
  - vocabulary.uncountable-nouns
