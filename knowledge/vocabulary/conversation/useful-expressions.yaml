id: vocabulary.conversation-expressions
title: Useful Conversation Expressions
kind: vocabulary
level: A1-A2
category: vocabulary.conversation
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [9]
source_coverage: Unit 9 conversational adverbs, suggestion patterns, reactions, warnings and agreement patterns are represented with source-highlighted form errors.
core_concept: Use short fixed expressions to manage everyday conversation: suggest, decide, react, warn and agree.
mental_model: Treat these as ready-made speaking chunks rather than sentences to build word by word.
key_items:
  - actually
  - really
  - else
  - around
  - anyway
  - Why don't we ...?
  - Let's ...
  - I don't mind.
  - It's up to you.
  - How about ...?
  - What about ...?
  - Oh dear!
  - It doesn't matter.
  - What a pity!
  - Hurry up!
  - Look out!
  - Be careful!
  - Absolutely!
  - I agree.
collocations:
  - Why don't we + base verb
  - Let's + base verb
  - How/What about + verb-ing
common_mistakes:
  - Actually means "in reality" in this unit, not "now".
  - Use "Why don't we go" and "Let's go", not verb-ing after these patterns.
  - Use "How about going?" / "What about going?", not the base verb.
  - Say "I agree", not "I am agree".
examples:
  - Why don't we review this tomorrow?
  - I don't mind. It's up to you.
recognition_drills:
  - Choose the correct verb form after Why don't we, Let's and How about.
production_drills:
  - Make one suggestion and one natural response using the unit's chunks.
speaking_drills:
  - Suggest something we could do this weekend.
related:
  - vocabulary.greetings-wishes
  - vocabulary.feelings
