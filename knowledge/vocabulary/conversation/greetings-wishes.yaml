id: vocabulary.greetings-wishes
title: Greetings and Wishes
kind: vocabulary
level: A1-A2
category: vocabulary.conversation
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [8]
source_coverage: Unit 8 everyday greetings/leaving expressions, politeness expressions and special-day wishes are represented.
core_concept: Choose greeting and wish expressions by social situation: arriving, leaving, bedtime, asking, thanking or marking a special event.
mental_model: Situation first, fixed phrase second.
key_items:
  - Good morning.
  - Good afternoon.
  - Good evening.
  - Hello.
  - Hi.
  - How are you?
  - Fine, thanks.
  - Goodbye.
  - See you soon.
  - Goodnight.
  - Sleep well.
  - Please.
  - Thank you.
  - Cheers.
  - Excuse me.
  - Sorry.
  - Bless you.
  - Happy Birthday!
  - Merry Christmas!
  - Happy New Year!
  - Good luck!
  - Congratulations!
  - Well done!
collocations:
  - say goodnight when leaving or going to bed
  - wish somebody good luck before something difficult
  - say congratulations/well done after an achievement
common_mistakes:
  - Do not use Goodnight as an arrival greeting.
  - For a birthday, say Happy Birthday rather than Congratulations.
examples:
  - Good luck with your interview tomorrow!
  - Well done on finishing the project!
recognition_drills:
  - Pick the natural expression for arriving, leaving, bedtime or a special event.
production_drills:
  - Respond naturally to three short social situations.
speaking_drills:
  - What would you say to a friend before an important interview?
related:
  - vocabulary.conversation-expressions
