id: vocabulary.preposition-collocations
title: Words and Prepositions
kind: vocabulary
level: A1-A2
category: vocabulary.collocations
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [57]
source_coverage: Unit 57 verb-preposition chunks, look phrasal/prepositional meanings, adjective-preposition chunks, used to/get used to, and preposition + noun/-ing grammar are represented.
core_concept: Learn frequent words together with their prepositions because the combination carries both grammar and meaning.
mental_model: Store the chunk as one lexical unit; if an action follows the preposition, use its -ing form.
key_items:
  - listen to
  - wait for
  - ask for
  - pay for
  - come to
  - belong to
  - think about
  - thank somebody for
  - apologise for
  - look at / look for / look after / look forward to
  - good at / bad at
  - interested in
  - afraid of
  - proud of
  - be used to / get used to
collocations:
  - look forward to + noun/-ing
  - good at + noun/-ing
  - apologise for + noun/-ing
  - proud of + noun/-ing
  - used to + noun/-ing in the 'accustomed to' pattern taught here
common_mistakes:
  - A preposition is followed by a noun or -ing form in the source patterns.
  - Happy about a result differs from happy for a person when expressing pleasure on someone's behalf.
examples:
  - I'm looking forward to practising with real conversations.
  - She's good at explaining things and proud of finishing the course.
recognition_drills:
  - Match words to prepositions and distinguish look at/for/after/forward to.
production_drills:
  - Complete original prompts with the whole collocation, including two -ing forms.
speaking_drills:
  - What are you good at, and what are you looking forward to?
related: [grammar.adjective-preposition, grammar.verb-preposition]
