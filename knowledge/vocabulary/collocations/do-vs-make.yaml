id: vocabulary.collocation.do-vs-make
title: Do vs Make Collocations
kind: vocabulary
level: A1-A2
category: vocabulary.collocations
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [40, 41]
  - source: egiu-4e
    units: [57]
source_coverage: All three source units are represented, including do as auxiliary/general action, job questions, core do/make collocations and make + person + feel; copied exercise sets remain outside Git.
core_concept: Do is the general action/task verb and also an auxiliary; make commonly focuses on creating/producing and occurs in fixed collocations. Learn high-frequency combinations as chunks.
mental_model: Meaning helps, but collocation decides: retrieve do/make together with the noun or expression.
key_items:
  - do nothing
  - do homework
  - do housework
  - do the gardening
  - do the washing
  - do the washing-up
  - do exercises
  - do a course
  - do an exam/test
  - do somebody a favour
  - do your best
  - do business with
  - make coffee/tea/dinner
  - make a mistake
  - make an appointment
  - make a phone call
  - make a list
  - make your bed
  - make a noise
  - make a mess
  - make a choice
  - make a film/video
collocations:
  - make somebody (feel) + adjective
  - What do you do? = What's your job?
common_mistakes:
  - Do homework, not make homework.
  - Take or do an exam, not make an exam.
  - Take a photo, not make a photo.
  - Do the washing, not make the washing.
examples:
  - I made a mistake while doing the exercise.
  - This delay made me feel frustrated.
recognition_drills:
  - Choose do or make for ten high-frequency source-grounded collocations.
production_drills:
  - Describe a workday using at least two do and two make chunks.
speaking_drills:
  - What tasks do you do every day, and what decisions or calls do you make?
related:
  - grammar.auxiliaries-be-have-do
  - vocabulary.jobs
