id: vocabulary.prefixes
title: Prefixes
kind: vocabulary
level: A1-A2
category: vocabulary.word-formation
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [58]
source_coverage: Unit 58 source prefixes ex-, half-, in-/im-, non-, pre-, re- and un-, their core meanings and hyphen caution are represented.
core_concept: Common prefixes add reusable meanings such as former, half, not, before and again to a base word.
mental_model: Prefix meaning + base meaning -> infer the new word, then verify spelling/hyphen when needed.
key_items:
  - ex- = former
  - half- = 50 percent
  - in-/im- = not
  - non- = not
  - pre- = before
  - re- = again
  - un- = not/opposite
examples:
  - rewrite = write again
  - impossible = not possible
  - pre-heat = heat before cooking
  - unsafe = not safe
common_mistakes:
  - Hyphen use varies by word; the source recommends checking a dictionary when unsure.
recognition_drills:
  - Infer meanings of new elementary words from the source prefix meanings.
production_drills:
  - Build a word from a prefix + base clue and explain the resulting meaning.
speaking_drills:
  - Use one re- word and one un-/im- word to describe something you did recently.
