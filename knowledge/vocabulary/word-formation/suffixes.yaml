id: vocabulary.suffixes
title: Suffixes
kind: vocabulary
level: A1-A2
category: vocabulary.word-formation
status: expanded
source_refs:
  - source: eviu-elementary-3e
    units: [59]
source_coverage: Unit 59 common suffix patterns shown through person/device nouns, adverbs, adjective families and related derived words are represented.
core_concept: Common suffixes can change a base word's word class or meaning, helping learners infer and build related vocabulary.
mental_model: Base word -> suffix -> likely word class/meaning; confirm irregular spelling when necessary.
key_items:
  - -er/-or for people or things that perform an action in common source examples
  - -ly for many adverbs
  - -ful for 'with/full of' qualities
  - -less for 'without' qualities
  - -y for many adjective forms such as weather descriptions
  - -ness for abstract noun forms in common derivations
examples:
  - teach -> teacher
  - travel -> traveller
  - slow -> slowly
  - help -> helpful
  - pain -> painless
  - rain -> rainy
  - kind -> kindness
common_mistakes:
  - Suffixes can trigger spelling changes, so do not assume simple letter addition in every word.
recognition_drills:
  - Identify the likely word class and base word from common suffixed forms.
production_drills:
  - Build derived words from base-word clues and place them in original sentences.
speaking_drills:
  - Describe a helpful person and a rainy or sunny day using derived words.
