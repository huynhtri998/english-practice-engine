id: grammar.possessive-adjectives
title: Possessive Adjectives
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [60]
source_coverage: Unit 60 my/your/his/her/its/our/their before nouns is represented and linked to the personal-pronoun system.
core_concept: Use a possessive adjective directly before a noun to show who it belongs or relates to.
mental_model: Owner first -> choose possessive form -> noun immediately after it.
forms:
  mapping:
    - I -> my
    - you -> your
    - he -> his
    - she -> her
    - it -> its
    - we -> our
    - they -> their
common_mistakes:
  - Do not combine a possessive adjective with an article before the same noun in this pattern.
  - Keep its (possessive) distinct from it's (it is/it has).
examples:
  - My laptop is on the desk.
  - Their deployment failed, but our deployment passed.
recognition_drills:
  - Choose the possessive adjective from the owner pronoun in context.
production_drills:
  - Rewrite noun phrases to show different owners using possessive adjectives.
speaking_drills:
  - What's your favourite tool for work, and why do you like it?
related:
  - grammar.object-pronouns
  - grammar.possessive-pronouns
