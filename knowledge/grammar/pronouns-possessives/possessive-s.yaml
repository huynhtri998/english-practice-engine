id: grammar.possessive-s
title: Possessive 's
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [64]
source_coverage: Unit 64 person's/people's ownership patterns and noun-of-noun alternatives are represented.
core_concept: Use 's especially with people to express possession or relationship; use of-patterns naturally with many things.
mental_model: Person/owner first -> 's -> thing; thing-part relationship often uses of.
forms:
  singular_owner: noun + 's + noun
  plural_s_owner: plural noun + ' + noun
  irregular_plural_owner: plural noun + 's + noun
common_mistakes:
  - Keep plural possessive punctuation distinct from ordinary plurals.
examples:
  - My brother's car is outside.
  - The roof of the building needs repair.
recognition_drills:
  - Choose 's, apostrophe-only, or of in short noun phrases.
production_drills:
  - Rewrite ownership phrases using the natural structure.
speaking_drills:
  - Describe one family member's job or belongings.
