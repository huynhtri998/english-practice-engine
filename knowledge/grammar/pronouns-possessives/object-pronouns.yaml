id: grammar.object-pronouns
title: Object Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 59
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use me, him, her, it, us and them as object forms after verbs and prepositions.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Object Pronouns distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Object Pronouns; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Object Pronouns without naming the grammar point
  in the question.
forms:
  forms: me, you, him, her, it, us, them
