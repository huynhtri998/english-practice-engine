id: grammar.object-pronouns
title: Subject and Object Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [59]
source_coverage: Unit 59 subject/object personal-pronoun contrasts are represented.
core_concept: Use subject pronouns before the verb as the doer/subject and object pronouns after verbs or prepositions as the receiver/object.
mental_model: Before the action = subject form; after the action/preposition = object form.
forms:
  pairs:
    - I -> me
    - he -> him
    - she -> her
    - we -> us
    - they -> them
    - you -> you
    - it -> it
common_mistakes:
  - Do not use I/he/she/we/they as ordinary objects after a verb or preposition.
examples:
  - She called me after the meeting.
  - I sent the file to him.
recognition_drills:
  - Choose the subject or object form in short two-clause sentences.
production_drills:
  - Replace repeated nouns with natural subject and object pronouns.
speaking_drills:
  - Who do you talk to most at work? Tell me about them.
related:
  - grammar.possessive-adjectives
  - grammar.pronoun-possessive-forms
