id: grammar.reflexive-pronouns
title: Reflexive Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 63
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use myself, yourself, himself, herself, itself, ourselves, yourselves and themselves when subject
  and object refer to the same person/thing or for emphasis in common patterns.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Reflexive Pronouns distinction and ask the learner to
  choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Reflexive Pronouns; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Reflexive Pronouns without naming the grammar point
  in the question.
forms:
  forms: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves
