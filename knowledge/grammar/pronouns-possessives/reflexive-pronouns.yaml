id: grammar.reflexive-pronouns
title: Reflexive Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [63]
source_coverage: Unit 63 myself/yourself/... patterns, by myself, and each other are represented.
core_concept: Use a reflexive pronoun when subject and object are the same person; use by + reflexive for alone/without help.
mental_model: The action comes back to the same participant.
forms:
  singular: [myself, yourself, himself, herself, itself]
  plural: [ourselves, yourselves, themselves]
usage:
  - subject and object are the same
  - by myself = alone / without help
  - each other for reciprocal actions between people
common_mistakes:
  - Use each other, not reflexives, when two people act on one another.
examples:
  - I taught myself the basics.
  - They helped each other during the incident.
recognition_drills:
  - Choose reflexive pronoun or each other from context.
production_drills:
  - Create one sentence with by myself and one with each other.
speaking_drills:
  - What is something you learned by yourself?
