id: grammar.pronoun-possessive-forms
title: Pronoun and Possessive Form Contrast
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 62
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Distinguish subject pronouns, object pronouns, possessive adjectives and possessive pronouns according
  to their role in the sentence.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Pronoun and Possessive Form Contrast distinction and ask
  the learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Pronoun and Possessive Form Contrast; add a negative/question
  transformation when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Pronoun and Possessive Form Contrast without naming
  the grammar point in the question.
