id: grammar.pronoun-possessive-forms
title: Personal and Possessive Forms
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [62]
source_coverage: Unit 62 contrasts subject, object, possessive-adjective and possessive-pronoun forms in one system.
core_concept: Choose the form by sentence role: subject, object, before a noun, or possession without a noun.
mental_model: Person -> role -> form.
forms:
  I: [I, me, my, mine]
  you: [you, you, your, yours]
  he: [he, him, his, his]
  she: [she, her, her, hers]
  we: [we, us, our, ours]
  they: [they, them, their, theirs]
common_mistakes:
  - Do not choose forms by meaning alone; choose by grammatical role.
examples:
  - She sent me her notes; mine were incomplete.
recognition_drills:
  - Label each pronoun slot as subject, object, possessive adjective or possessive pronoun.
production_drills:
  - Rewrite one paragraph to remove repeated names using the correct forms.
speaking_drills:
  - Tell me about a colleague and something that belongs to them.
related: [grammar.object-pronouns, grammar.possessive-adjectives, grammar.possessive-pronouns]
