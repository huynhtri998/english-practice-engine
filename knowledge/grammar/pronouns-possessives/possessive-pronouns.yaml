id: grammar.possessive-pronouns
title: Possessive Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: expanded
source_refs:
  - source: egiu-4e
    units: [61]
source_coverage: Unit 61 mine/yours/his/hers/ours/theirs, whose, and friend-of-mine patterns are represented.
core_concept: Use possessive pronouns without a following noun; use possessive adjectives before nouns.
mental_model: If the noun is already known or omitted, switch from my/your/her... to mine/yours/hers....
forms:
  pairs: [my-mine, your-yours, his-his, her-hers, our-ours, their-theirs]
usage:
  - answer whose questions
  - avoid repeating an already-known noun
  - use a friend of mine/his/yours
common_mistakes:
  - Say a friend of mine, not a friend of me.
  - Do not put a noun directly after mine/yours/hers/ours/theirs.
examples:
  - This laptop is mine; that one is yours.
  - A friend of mine works in security.
recognition_drills:
  - Choose possessive adjective or possessive pronoun in short contexts.
production_drills:
  - Replace repeated possessed nouns with possessive pronouns.
speaking_drills:
  - Whose phone is this? Answer naturally with a possessive pronoun.
related: [grammar.possessive-adjectives, grammar.pronoun-possessive-forms]
