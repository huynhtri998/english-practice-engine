id: grammar.possessive-pronouns
title: Possessive Pronouns
kind: grammar
level: elementary
category: grammar.pronouns-possessives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 61
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use mine, yours, his, hers, ours and theirs without a following noun.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Possessive Pronouns distinction and ask the learner to
  choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Possessive Pronouns; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Possessive Pronouns without naming the grammar
  point in the question.
forms:
  forms: mine, yours, his, hers, ours, theirs
