id: grammar.be
title: 'Be: am/is/are'
kind: grammar
level: elementary
category: grammar.present
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 1
  - 2
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use am/is/are to describe identity, state, age, location and similar present facts; form questions
  by placing the be form before the subject.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- 'Generate two original sentences that differ on the main Be: am/is/are distinction and ask the learner to choose
  the natural/correct one.'
production_drills:
- 'Ask for one original sentence that demonstrates Be: am/is/are; add a negative/question transformation when that
  form is relevant.'
speaking_drills:
- 'Ask one short everyday or work question that naturally elicits Be: am/is/are without naming the grammar point
  in the question.'
forms:
  affirmative: I am; he/she/it is; we/you/they are
  negative: am/is/are + not
  question: am/is/are + subject ...?
