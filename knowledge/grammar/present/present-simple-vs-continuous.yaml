id: grammar.present-simple-vs-continuous
title: Present Simple vs Present Continuous
kind: grammar
level: elementary
category: grammar.present
status: expanded
source_refs:
  - source: egiu-4e
    units: [8]
source_coverage: Unit 8 contrast is represented, including the source's elementary-level group of verbs normally used in the present simple rather than the present continuous.
core_concept: Choose present continuous for what is happening now and present simple for what is true in general or happens regularly.
mental_model: Ask one fast question: "now/in progress, or generally/regularly?"
contrasts:
  present_continuous: now, at the time of speaking
  present_simple: in general, all the time or sometimes
usage:
  - use present continuous for an action in progress now
  - use present simple for habits, repeated situations and general facts
  - at this level, use present simple with verbs such as know, understand, want, need, prefer, like, remember, forget, mean and believe
common_mistakes:
  - Do not use present simple just because the sentence contains a present-time word if the action is visibly in progress.
  - Avoid continuous forms such as "I'm knowing" or "I'm wanting" for the source-highlighted verbs.
examples:
  - I usually work on backend services, but I'm fixing a frontend bug right now.
  - She knows the answer, but she isn't saying anything.
recognition_drills:
  - Pick the natural sentence for a temporary current action and explain the trigger.
production_drills:
  - Make two linked sentences: one about your normal routine and one about what you are doing now.
speaking_drills:
  - What do you usually work on, and what are you working on today?
related:
  - grammar.present-simple
  - grammar.present-continuous
