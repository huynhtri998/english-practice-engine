id: grammar.present-simple-vs-continuous
title: Present Simple vs Present Continuous
kind: grammar
level: elementary
category: grammar.present
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 8
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Choose present continuous for something in progress now and present simple for general or repeated
  situations; some state verbs are normally kept in the simple form.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Present Simple vs Present Continuous distinction and ask
  the learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Present Simple vs Present Continuous; add a negative/question
  transformation when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Present Simple vs Present Continuous without naming
  the grammar point in the question.
contrasts:
- 'Present continuous: action in progress now/around now.'
- 'Present simple: general truth, routine or repeated situation.'
related:
- grammar.present-simple
- grammar.present-continuous
prerequisites:
- grammar.present-simple
- grammar.present-continuous
