id: grammar.have-vs-have-got
title: Have and Have Got
kind: grammar
level: elementary
category: grammar.present
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 9
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use have or have got to talk about possession and similar states; both have their own common negative
  and question patterns.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Have and Have Got distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Have and Have Got; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Have and Have Got without naming the grammar point
  in the question.
forms:
  have: subject + have/has ...
  have_got: subject + have/has got ...
