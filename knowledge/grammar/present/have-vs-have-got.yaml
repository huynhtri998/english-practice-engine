id: grammar.have-vs-have-got
title: Have and Have Got
kind: grammar
level: elementary
category: grammar.present
status: expanded
source_refs:
  - source: egiu-4e
    units: [9]
source_coverage: Unit 9 equivalence and the two negative/question patterns are represented; broader activity expressions with have remain in the separate vocabulary KU.
core_concept: For possession and similar present states, have and have got can express the same meaning, but their negative and question patterns are different.
mental_model: Choose one pattern and keep it consistent: do/does + have, or have/has + got.
forms:
  affirmative:
    - I/you/we/they have ... = I/you/we/they have got ...
    - he/she/it has ... = he/she/it has got ...
  negative:
    - don't/doesn't have
    - haven't/hasn't got
  question:
    - Do/Does + subject + have ...?
    - Have/Has + subject + got ...?
usage:
  - possession
  - relationships or features such as siblings, eyes, doors
  - present conditions such as a headache
common_mistakes:
  - Do not mix the two question systems, for example "Do you have got ...?"
  - The source uses had, didn't have and Did ... have? for the past, without got.
examples:
  - I have two monitors. / I've got two monitors.
  - Does the project have a deadline? / Has the project got a deadline?
recognition_drills:
  - Identify whether each question correctly follows the have-pattern or the have-got pattern.
production_drills:
  - Say the same possession once with have and once with have got.
speaking_drills:
  - Have you got any plans for the weekend?
related:
  - vocabulary.verb.have
  - grammar.auxiliaries-be-have-do
