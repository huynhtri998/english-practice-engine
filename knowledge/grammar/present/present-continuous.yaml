id: grammar.present-continuous
title: Present Continuous
kind: grammar
level: elementary
category: grammar.present
status: expanded
source_refs:
  - source: egiu-4e
    units: [3, 4, 8]
source_coverage: Units 3-4 supply present continuous statements/questions and Unit 8 supplies the contrast with present simple.
core_concept: Use am/is/are + verb-ing for an action happening now, at the time of speaking.
mental_model: Put the action inside the current moment: it is in progress rather than a general habit or fact.
forms:
  affirmative: subject + am/is/are + verb-ing
  negative: subject + am/is/are + not + verb-ing
  question: am/is/are + subject + verb-ing?
usage:
  - action happening now
  - ask what somebody is doing now
contrasts:
  present_simple: Present simple describes what is generally true or happens regularly; present continuous focuses on what is happening now.
common_mistakes:
  - Do not omit am/is/are before verb-ing.
  - In questions, put am/is/are before the subject.
  - Do not use the base verb after am/is/are when describing an action in progress.
examples:
  - I'm reviewing a pull request right now.
  - The team isn't deploying at the moment.
  - Are you working from home today?
recognition_drills:
  - Decide which sentence describes the current action: "I check logs every morning" or "I'm checking the logs now".
production_drills:
  - Say what you are doing now, then make the sentence negative.
speaking_drills:
  - What are you doing right now?
related:
  - grammar.present-simple
  - grammar.present-simple-vs-continuous
