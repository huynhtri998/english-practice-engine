id: grammar.present-simple
title: Present Simple
kind: grammar
level: elementary
category: grammar.present
status: expanded
source_refs:
  - source: egiu-4e
    units: [5, 6, 7]
source_coverage: Units 5-7 cover affirmative forms, third-person spelling, negatives with don't/doesn't, questions with do/does and short answers.
core_concept: Use the present simple for things that are generally true and for actions or situations that happen regularly, sometimes or all the time.
mental_model: Think "this is how things usually are" rather than "this is happening right now".
forms:
  affirmative:
    - I/you/we/they + base verb
    - he/she/it + verb-s/-es
  negative:
    - I/you/we/they + don't + base verb
    - he/she/it + doesn't + base verb
  question:
    - Do + I/you/we/they + base verb?
    - Does + he/she/it + base verb?
usage:
  - general facts
  - habits and repeated actions
  - actions that happen sometimes or regularly
  - frequency expressions such as always, never, often, usually and sometimes
common_mistakes:
  - Add -s/-es to an affirmative third-person singular verb.
  - After doesn't or does, use the base verb, not a verb with -s.
  - Do not use am/is/are before an ordinary present-simple verb.
examples:
  - I review code every morning.
  - Our service doesn't restart very often.
  - Does your team deploy on Fridays?
recognition_drills:
  - Choose the form for a regular habit: "I usually work" or "I'm usually working".
production_drills:
  - Describe one work habit, then turn it into a question about another person.
speaking_drills:
  - What do you usually do after work?
related:
  - grammar.present-continuous
  - grammar.present-simple-vs-continuous
