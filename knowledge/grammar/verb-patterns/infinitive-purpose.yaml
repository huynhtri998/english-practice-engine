id: grammar.infinitive-purpose
title: Infinitive for Purpose
kind: grammar
level: elementary
category: grammar.verb-patterns
status: expanded
source_refs:
  - source: egiu-4e
    units: [54]
source_coverage: Unit 54 uses to + base verb for purpose and contrasts it with for + noun and for + person/thing + to-infinitive patterns.
core_concept: Use to + base verb to answer why an action is done; use for before a noun, and use for + person/thing + to-infinitive when naming who/what performs the infinitive action.
mental_model: Purpose action -> to + verb; purpose thing/use -> for + noun.
forms:
  purpose: to + base verb
  noun_purpose: for + noun
  person_infinitive: for + person/thing + to + base verb
common_mistakes:
  - Do not say "for buy" when the purpose is an action; use "to buy".
examples:
  - I opened the logs to find the error.
  - This tool is for testing APIs.
  - I'm waiting for the build to finish.
recognition_drills:
  - Choose to + verb or for + noun in a fresh purpose context.
production_drills:
  - Explain why you use one work tool with an infinitive of purpose.
speaking_drills:
  - Why are you learning English?
related:
  - grammar.object-plus-infinitive
  - grammar.how-long-does-it-take
