id: grammar.object-plus-infinitive
title: Object + Infinitive Patterns
kind: grammar
level: elementary
category: grammar.verb-patterns
status: expanded
source_refs:
  - source: egiu-4e
    units: [53]
source_coverage: Unit 53 patterns with want/tell/ask/advise/teach + person + to-infinitive, negative infinitives, and let/make + person + base verb are represented.
core_concept: When one person wants, tells, asks or advises another person to act, put the person object before the infinitive; let and make use the base verb without to in the source pattern.
mental_model: Controller verb -> person -> action.
forms:
  to_pattern: verb + person + to + base verb
  negative: verb + person + not to + base verb
  bare_pattern:
    - let + person + base verb
    - make + person + base verb
common_mistakes:
  - Say "I want you to listen", not "I want that you listen" in the source pattern.
  - Do not add to after let or make in the source's bare-infinitive pattern.
examples:
  - I want you to check this file.
  - She told me not to deploy yet.
  - The bug made me rewrite the test.
recognition_drills:
  - Choose whether the object is followed by to + verb or a bare verb after the target controller.
production_drills:
  - Make one want/tell/ask sentence and one let/make sentence.
speaking_drills:
  - What does your manager sometimes ask you to do?
related:
  - grammar.infinitive-vs-ing
  - grammar.infinitive-purpose
