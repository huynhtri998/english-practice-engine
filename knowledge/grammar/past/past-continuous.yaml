id: grammar.past-continuous
title: Past Continuous
kind: grammar
level: elementary
category: grammar.past
status: expanded
source_refs:
  - source: egiu-4e
    units: [13]
source_coverage: Unit 13 past continuous form and its in-progress past-time meaning are represented.
core_concept: Use was/were + verb-ing for an action that was in progress at a particular time in the past.
mental_model: Imagine opening a camera view at a past moment and describing what was already happening then.
forms:
  affirmative: subject + was/were + verb-ing
  negative: subject + wasn't/weren't + verb-ing
  question: Was/Were + subject + verb-ing?
usage:
  - action in progress at a stated past time
  - background activity around another past event
common_mistakes:
  - Use was/were before verb-ing.
  - Do not use did with the past continuous.
examples:
  - I was reviewing logs at 10 p.m.
  - They weren't sleeping when I called.
  - What were you doing at lunchtime?
recognition_drills:
  - Decide which sentence shows an action in progress at a past moment.
production_drills:
  - Say what you were doing at a specific time yesterday.
speaking_drills:
  - What were you doing at 9 o'clock last night?
related:
  - grammar.past-simple
  - grammar.past-simple-vs-continuous
