id: grammar.be-past
title: 'Be in the Past: was/were'
kind: grammar
level: elementary
category: grammar.past
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 10
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use was/were as the past forms of am/is/are, including negatives and questions.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- 'Generate two original sentences that differ on the main Be in the Past: was/were distinction and ask the learner
  to choose the natural/correct one.'
production_drills:
- 'Ask for one original sentence that demonstrates Be in the Past: was/were; add a negative/question transformation
  when that form is relevant.'
speaking_drills:
- 'Ask one short everyday or work question that naturally elicits Be in the Past: was/were without naming the grammar
  point in the question.'
forms:
  affirmative: I/he/she/it was; we/you/they were
  negative: wasn't/weren't
  question: was/were + subject ...?
