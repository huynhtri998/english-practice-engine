id: grammar.be-past
title: Was and Were
kind: grammar
level: elementary
category: grammar.past
status: expanded
source_refs:
  - source: egiu-4e
    units: [10]
source_coverage: Unit 10 past forms of be, negatives and question order are represented.
core_concept: Was/were are the past forms of am/is/are; use was with I/he/she/it and were with we/you/they.
mental_model: Keep the be-system in the past: was/were carry the tense themselves, so no did is needed.
forms:
  affirmative:
    - I/he/she/it was
    - we/you/they were
  negative:
    - wasn't
    - weren't
  question:
    - Was + I/he/she/it ...?
    - Were + we/you/they ...?
common_mistakes:
  - Do not use did with was/were questions.
  - Match was/were to the subject.
examples:
  - The build was slow yesterday.
  - We weren't in the office last week.
  - Were you tired after the trip?
recognition_drills:
  - Choose was or were for a set of subjects, then identify the correct question order.
production_drills:
  - Describe where you were yesterday evening and ask the same question to another person.
speaking_drills:
  - Where were you yesterday at 8 p.m.?
related:
  - grammar.be
  - grammar.past-simple
