id: grammar.past-simple-vs-continuous
title: Past Simple vs Past Continuous
kind: grammar
level: elementary
category: grammar.past
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 14
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use past continuous for background/in-progress activity and past simple for a completed event, especially
  when one event interrupts another.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Past Simple vs Past Continuous distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Past Simple vs Past Continuous; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Past Simple vs Past Continuous without naming the
  grammar point in the question.
contrasts:
- 'Past continuous: background or action in progress at a past time.'
- 'Past simple: completed event or event that moves the story forward.'
related:
- grammar.past-simple
- grammar.past-continuous
prerequisites:
- grammar.past-simple
- grammar.past-continuous
