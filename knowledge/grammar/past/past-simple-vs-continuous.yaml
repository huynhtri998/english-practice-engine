id: grammar.past-simple-vs-continuous
title: Past Simple vs Past Continuous
kind: grammar
level: elementary
category: grammar.past
status: expanded
source_refs:
  - source: egiu-4e
    units: [14]
source_coverage: Unit 14 contrast between an action in progress and a completed/event action in the past is represented.
core_concept: Use past continuous for the activity already in progress and past simple for the event or completed action that happened during or around it.
mental_model: Background camera = was/were + -ing; event dot = past simple.
contrasts:
  past_continuous: action in progress at that past time
  past_simple: completed event/action
common_mistakes:
  - Do not put both verbs in the continuous just because two things happened in the past.
  - Use the base verb after did/didn't when the simple form is questioned or negated.
examples:
  - I was walking home when it started to rain.
  - The build failed while I was having dinner.
recognition_drills:
  - Identify the background action and the event in a two-clause past sentence.
production_drills:
  - Complete an original sentence beginning "I was ... when ...".
speaking_drills:
  - What were you doing when you got your last important message?
related:
  - grammar.past-simple
  - grammar.past-continuous
