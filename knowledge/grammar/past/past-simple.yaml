id: grammar.past-simple
title: Past Simple
kind: grammar
level: elementary
category: grammar.past
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 11
  - 12
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use the past simple for completed past events; regular verbs usually take -ed, irregular verbs change
  form, and did/didn't + base verb forms questions and negatives.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Past Simple distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Past Simple; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Past Simple without naming the grammar point in
  the question.
forms:
  affirmative: past form (regular -ed or irregular form)
  negative: didn't + base verb
  question: did + subject + base verb?
related:
- grammar.past-continuous
- grammar.past-simple-vs-continuous
- grammar.present-perfect-vs-past-simple
