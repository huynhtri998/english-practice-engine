id: grammar.past-simple
title: Past Simple
kind: grammar
level: elementary
category: grammar.past
status: expanded
source_refs:
  - source: egiu-4e
    units: [11, 12]
source_coverage: Units 11-12 cover regular and irregular affirmative forms plus negatives/questions with did and the infinitive.
core_concept: Use the past simple for completed past actions or situations; affirmative verbs use a past form, while negatives and questions use did/didn't + base verb.
mental_model: The event belongs to a finished past time. In negatives/questions, did carries the past tense and the main verb returns to its base form.
forms:
  affirmative:
    - regular verb + -ed
    - irregular past form
  negative: subject + didn't + base verb
  question: Did + subject + base verb?
usage:
  - completed action in the past
  - past sequence of completed events
common_mistakes:
  - After did or didn't, use the base verb: "didn't go", not "didn't went".
  - Learn irregular past forms separately.
examples:
  - I finished the migration yesterday.
  - We didn't deploy last night.
  - Did the test pass?
recognition_drills:
  - Choose the correct pair: "Did you go?" / "Did you went?"
production_drills:
  - Tell one completed thing you did yesterday, then make a negative and a question.
speaking_drills:
  - What did you do after work yesterday?
related:
  - grammar.be-past
  - grammar.past-continuous
  - grammar.present-perfect-vs-past-simple
