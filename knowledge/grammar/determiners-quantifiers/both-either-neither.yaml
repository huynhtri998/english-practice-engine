id: grammar.both-either-neither
title: Both, Either and Neither
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 82
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use both for two together, either for one of two, and neither for not one and not the other.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Both, Either and Neither distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Both, Either and Neither; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Both, Either and Neither without naming the grammar
  point in the question.
