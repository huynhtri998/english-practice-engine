id: grammar.both-either-neither
title: Both, Either and Neither
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [82]
source_coverage: Unit 82 two-item meanings, noun patterns, of-patterns and pronoun forms are represented.
core_concept: With exactly two choices/items, both means the two, either means one or the other, and neither means not one and not the other.
mental_model: First check that the set size is two; then choose 2/1/0: both/either/neither.
forms:
  both: both + plural noun
  either: either + singular noun
  neither: neither + singular noun
  of_forms: both/either/neither + of + determiner/pronoun
common_mistakes:
  - Avoid a double negative such as I don't want neither; use I don't want either or I want neither.
  - Neither of ... is singular in the source pattern.
examples:
  - Both options work, but either one is fine.
  - Neither of the fixes solved the issue.
recognition_drills:
  - Choose both/either/neither for six two-item situations.
production_drills:
  - Create one sentence for each of both, either and neither.
speaking_drills:
  - Do you prefer working from home or the office, or is either fine?
