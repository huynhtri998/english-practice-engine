id: grammar.a-lot-much-many
title: A Lot, Much and Many
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [83]
source_coverage: Unit 83 countability patterns, question/negative preferences and nounless a lot/much uses are represented.
core_concept: Many goes with plural countables, much with uncountables, and a lot of works with both; much is especially common in questions and negatives at this level.
mental_model: Countable plural -> many; uncountable -> much; neutral/high-frequency positive quantity -> a lot of.
forms:
  many: many + plural countable noun
  much: much + uncountable noun
  a_lot_of: a lot of + plural countable/uncountable noun
usage:
  - much is common in negatives/questions
  - a lot can stand without a noun in frequency/quantity contexts
common_mistakes:
  - Match there are with a lot of plural nouns and there is with a lot of uncountable material.
examples:
  - We don't have much time, but we have a lot of ideas.
  - How many deployments did you do this week?
recognition_drills:
  - Choose much/many/a lot of based on noun type and sentence type.
production_drills:
  - Turn three quantity prompts into natural questions and answers.
speaking_drills:
  - Do you have much free time during the week?
