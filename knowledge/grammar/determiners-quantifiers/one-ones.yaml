id: grammar.one-ones
title: One and Ones
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [75]
source_coverage: Unit 75 one/ones as noun substitutes after demonstratives, adjectives and the is represented.
core_concept: Use one/ones to avoid repeating a countable noun that is already clear.
mental_model: Known countable noun omitted -> one (singular) or ones (plural).
usage:
  - this one / that one
  - the one ... / the ones ...
  - a clean one / some new ones
common_mistakes:
  - Use one only for singular countable nouns; use ones for plural countables.
examples:
  - Which branch? The one with the migration commit.
  - These tests failed, but the new ones passed.
recognition_drills:
  - Choose one/ones or repeat the noun only when needed.
production_drills:
  - Rewrite repetitive noun phrases using one/ones.
speaking_drills:
  - Which one do you prefer?
