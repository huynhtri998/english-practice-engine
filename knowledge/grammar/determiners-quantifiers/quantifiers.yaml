id: grammar.quantifiers
title: All, Most, Some, Any, No and None
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [81]
source_coverage: Unit 81 general quantifiers, of-patterns, pronoun forms and no/none distinctions are represented.
core_concept: Use quantifiers directly before a general noun, but use of before a determiner/pronoun-defined group.
mental_model: General category -> quantifier + noun; specific known set -> quantifier + of + determiner/pronoun.
forms:
  general: all/most/some/any/no + noun
  specific: all/most/some/any/none + of + the/this/my/us/them...
usage:
  - all may appear with or without of before the/this/my-type determiners
  - none replaces no when the noun is omitted
common_mistakes:
  - Say most people, not most of people.
  - Say some of these books when the group is specifically identified.
examples:
  - Most developers on the team use this tool.
  - Some of these tests are flaky; none of them are blocking.
recognition_drills:
  - Choose whether of is required after a quantifier.
production_drills:
  - Rewrite general statements as statements about a specific group.
speaking_drills:
  - How many of your teammates work remotely: all, most, some or none?
