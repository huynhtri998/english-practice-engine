id: grammar.any-no-none
title: Any, No and None
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [77]
source_coverage: Unit 77 not + any, no + noun, and none as a pronoun/answer are represented.
core_concept: Express zero quantity either with negative verb + any or positive verb + no; use none when the noun is omitted.
mental_model: Choose one negative marker only.
forms:
  negative_any: not + any + noun
  no_noun: no + noun
  none: noun omitted
common_mistakes:
  - Avoid double negatives such as don't have no money in standard English.
examples:
  - We don't have any blockers.
  - We have no blockers. None are critical.
recognition_drills:
  - Convert between not any and no without changing meaning.
production_drills:
  - Answer quantity questions with none where natural.
speaking_drills:
  - Are there any problems left?
