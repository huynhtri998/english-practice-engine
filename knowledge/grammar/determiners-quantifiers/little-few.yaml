id: grammar.little-few
title: Little, A Little, Few and A Few
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [84]
source_coverage: Unit 84 countable/uncountable choice and the meaning contrast created by a in a little/a few are represented.
core_concept: Few/a few go with plural countables; little/a little go with uncountables. Without a, the meaning emphasizes scarcity; with a, it means some.
mental_model: Noun type first; then attitude to quantity: almost none -> few/little, some and enough to matter -> a few/a little.
forms:
  countable: few / a few + plural noun
  uncountable: little / a little + noun
contrasts:
  few_vs_a_few: very few/almost none vs some
  little_vs_a_little: very little/almost none vs some
common_mistakes:
  - Do not use few with an uncountable noun or little with plural countables.
examples:
  - I have a little time before the meeting.
  - Few people knew about the change, but a few had read the notice.
recognition_drills:
  - Choose among little/a little/few/a few and explain the quantity meaning.
production_drills:
  - Write paired sentences showing the meaning difference made by a.
speaking_drills:
  - Do you have a little time to practise English every day?
