id: grammar.some-any
title: Some and Any
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [76]
source_coverage: Unit 76 some/any with nouns and something/anything/somebody/anybody, including offers/requests, is represented.
core_concept: Some is common in positive statements and expected-positive offers/requests; any is common in negatives and open questions.
mental_model: Positive/available -> some; negative/open possibility -> any; polite offer/request may still use some.
usage:
  - some + plural/uncountable noun
  - any + plural/uncountable noun
  - somebody/something vs anybody/anything
common_mistakes:
  - Do not mechanically replace some with any in offers such as Would you like some tea?
examples:
  - I need some help.
  - Do you have any questions?
recognition_drills:
  - Choose some/any in statements, questions, negatives and offers.
production_drills:
  - Make one offer, one question and one negative using the correct form.
speaking_drills:
  - Do you need any help? Would you like some coffee?
