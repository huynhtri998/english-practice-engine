id: grammar.some-any
title: Some and Any
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 76
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use some mainly in affirmative statements and any mainly in negatives/questions, with common exceptions
  such as offers and requests.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Some and Any distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Some and Any; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Some and Any without naming the grammar point in
  the question.
forms:
  some: some + noun
  any: any + noun
