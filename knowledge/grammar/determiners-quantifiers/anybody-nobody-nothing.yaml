id: grammar.anybody-nobody-nothing
title: Anybody, Nobody and Nothing
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [78]
source_coverage: Unit 78 negative-any compounds versus positive nobody/no-one/nothing forms are represented.
core_concept: Use negative verb + anybody/anything or positive verb + nobody/nothing to express absence; do not combine both negatives.
mental_model: One negative signal per clause.
forms:
  negative_any: don't/didn't/etc. + anybody/anything
  no_compound: nobody/no-one/nothing + positive verb
common_mistakes:
  - Source explicitly contrasts doesn't know anything with knows nothing, not doesn't know nothing.
examples:
  - I didn't see anybody.
  - Nobody answered the message.
recognition_drills:
  - Correct double-negative sentences.
production_drills:
  - Rewrite between any-compound and no-compound forms.
speaking_drills:
  - Who did you speak to? Answer with nobody/no-one or a full negative sentence.
