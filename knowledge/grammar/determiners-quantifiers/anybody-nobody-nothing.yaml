source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use any- forms mainly in questions/negatives and no- forms to make a negative meaning without another
  negative verb.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Anybody/Anyone/Anything and Nobody/No-one/Nothing distinction
  and ask the learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Anybody/Anyone/Anything and Nobody/No-one/Nothing; add a negative/question
  transformation when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Anybody/Anyone/Anything and Nobody/No-one/Nothing
  without naming the grammar point in the question.
