id: grammar.every-all
title: Every and All
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [80]
source_coverage: Unit 80 every + singular noun, all + plural/uncountable noun, all day vs every day, and everybody/everything/everywhere are represented.
core_concept: Every treats members individually and takes singular nouns; all refers to the whole set/amount and works with plural or uncountable nouns.
mental_model: Each member one by one -> every; whole group/period -> all.
forms:
  every: every + singular noun
  all: all + plural/uncountable noun
usage:
  - every day vs all day
  - everybody/everyone/everything/everywhere take singular verb agreement in the source patterns
common_mistakes:
  - Say every student, not every students.
examples:
  - I review English every day.
  - I studied almost all day yesterday.
recognition_drills:
  - Choose every/all and correct noun agreement.
production_drills:
  - Contrast every day with all day in two original sentences.
speaking_drills:
  - What do you do every day, and what did you do all day yesterday?
