id: grammar.every-all
title: Every and All
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 80
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use every with a singular noun to consider members individually, and all with plural/uncountable nouns
  to refer to the whole group/amount.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Every and All distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Every and All; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Every and All without naming the grammar point
  in the question.
