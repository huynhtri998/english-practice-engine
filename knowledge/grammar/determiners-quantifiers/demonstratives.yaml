id: grammar.demonstratives
title: This, That, These and Those
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 74
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use this/these for nearer things and that/those for more distant things, matching singular/plural.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main This, That, These and Those distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates This, That, These and Those; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits This, That, These and Those without naming the
  grammar point in the question.
