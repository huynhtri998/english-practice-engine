id: grammar.demonstratives
title: This, That, These and Those
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [74]
source_coverage: Unit 74 singular/plural demonstratives for near/far reference and common discourse uses are represented.
core_concept: Match demonstratives to number and distance/context: this/these nearer, that/those farther.
mental_model: Number first, then near/far.
forms:
  singular_near: this
  singular_far: that
  plural_near: these
  plural_far: those
common_mistakes:
  - Match these/those with plural nouns and this/that with singular nouns.
examples:
  - This file is current; those files are old.
recognition_drills:
  - Choose the demonstrative from number and distance clues.
production_drills:
  - Describe nearby and distant objects using all four forms.
speaking_drills:
  - What's this? What are those?
