id: grammar.somebody-anything-nowhere
title: Somebody, Anything, Somewhere and Related Forms
kind: grammar
level: elementary
category: grammar.determiners-quantifiers
status: expanded
source_refs:
  - source: egiu-4e
    units: [79]
source_coverage: Unit 79 -body/-one, -thing and -where families with some/any/no/every are represented.
core_concept: Build indefinite references systematically for people, things and places using some-, any-, no- and every- families.
mental_model: Choose dimension (person/thing/place) and polarity/scope prefix.
forms:
  person: [somebody/someone, anybody/anyone, nobody/no-one, everybody/everyone]
  thing: [something, anything, nothing, everything]
  place: [somewhere, anywhere, nowhere, everywhere]
common_mistakes:
  - These forms are single pronoun/adverb units; match the prefix to sentence polarity and meaning.
examples:
  - Someone left something on my desk.
  - I couldn't find it anywhere.
recognition_drills:
  - Complete a grid of person/thing/place indefinite forms.
production_drills:
  - Tell a short story using one some-, one any- and one no- form.
speaking_drills:
  - Did you go anywhere interesting last weekend?
