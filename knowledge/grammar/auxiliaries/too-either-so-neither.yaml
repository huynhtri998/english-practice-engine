id: grammar.too-either-so-neither
title: Too, Either, So and Neither
kind: grammar
level: elementary
category: grammar.auxiliaries
status: expanded
source_refs:
  - source: egiu-4e
    units: [42]
source_coverage: Unit 42 positive agreement with too/so and negative agreement with either/neither is represented across auxiliary patterns.
core_concept: Agree with a positive statement using too or so + auxiliary; agree with a negative statement using either or neither + auxiliary.
mental_model: Positive agreement and negative agreement each have two ready-made patterns; always copy the original auxiliary/tense.
forms:
  positive_end: subject + auxiliary/main pattern + too
  positive_front: So + auxiliary + subject
  negative_end: subject + negative auxiliary + either
  negative_front: Neither + auxiliary + subject
common_mistakes:
  - Use either with a negative clause, not a positive one.
  - Match do/be/have/modal and tense to the first statement.
examples:
  - I work from home sometimes. I do too.
  - I haven't finished yet. Neither have I.
recognition_drills:
  - Select too, either, so or neither and the matching auxiliary for a fresh dialogue.
production_drills:
  - Agree naturally with one positive and one negative statement.
speaking_drills:
  - I'll say a preference or habit; agree or disagree quickly.
related:
  - grammar.echo-questions
  - grammar.negatives
