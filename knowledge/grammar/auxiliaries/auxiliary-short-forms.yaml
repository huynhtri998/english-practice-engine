id: grammar.auxiliary-short-forms
title: Auxiliary Short Forms
kind: grammar
level: elementary
category: grammar.auxiliaries
status: expanded
source_refs:
  - source: egiu-4e
    units: [40]
source_coverage: Unit 40 consolidates short responses that repeat the auxiliary rather than the full lexical verb, across be/do/have/modal patterns.
core_concept: In short answers or repeated clauses, English often keeps the auxiliary and omits the main verb when the meaning is already understood.
mental_model: Repeat only the grammar carrier, not the whole sentence.
forms:
  be: am/is/are/was/were
  do: do/does/did
  have: have/has
  modal_future: can/could/will/would/should/might
usage:
  - short answers
  - avoid repeating a known verb phrase
  - respond naturally with the matching auxiliary
common_mistakes:
  - Match the short-form auxiliary to the original verb pattern and tense.
  - Do not answer a present-simple question with a form of be unless be is actually the verb.
examples:
  - Are you tired? Yes, I am.
  - Do you work remotely? Sometimes I do.
  - Have you finished? No, I haven't.
  - Can you drive? Yes, I can.
recognition_drills:
  - Choose the correct auxiliary for a short response to four different question types.
production_drills:
  - Answer five questions naturally without repeating the full verb phrase.
speaking_drills:
  - Do you use English at work? Answer in a short natural way, then add one detail.
related:
  - grammar.auxiliaries-be-have-do
  - grammar.echo-questions
  - grammar.too-either-so-neither
