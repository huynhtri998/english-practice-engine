id: grammar.auxiliary-short-forms
title: Auxiliary Short Responses
kind: grammar
level: elementary
category: grammar.auxiliaries
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 40
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use auxiliaries such as am/is/are, do/does/did, have/has and will in short answers and short replacement
  clauses instead of repeating the full verb phrase.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Auxiliary Short Responses distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Auxiliary Short Responses; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Auxiliary Short Responses without naming the grammar
  point in the question.
