id: grammar.echo-questions
title: Echo Questions
kind: grammar
level: elementary
category: grammar.auxiliaries
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 41
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use short auxiliary questions such as 'Are you?' or 'Did he?' to react to or check what someone has
  just said.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Echo Questions distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Echo Questions; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Echo Questions without naming the grammar point
  in the question.
