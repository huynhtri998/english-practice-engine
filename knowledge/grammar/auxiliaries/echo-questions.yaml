id: grammar.echo-questions
title: Reply Questions and Question Tags
kind: grammar
level: elementary
category: grammar.auxiliaries
status: expanded
source_refs:
  - source: egiu-4e
    units: [41]
source_coverage: Unit 41 reply questions and short question-tag patterns are represented; source exercises remain in the book.
core_concept: Reuse the auxiliary from the statement to make a short interested/surprised reply or a confirmation tag.
mental_model: Listen for the grammar carrier in the first sentence, then echo it with the matching subject pronoun.
forms:
  reply_question: auxiliary + subject?
  tag_positive_statement: positive statement + negative tag
  tag_negative_statement: negative statement + positive tag
usage:
  - show interest or surprise with replies such as Are you? / Did he? / Have they?
  - invite confirmation with a short tag
common_mistakes:
  - Match the auxiliary and tense to the statement.
  - Use a pronoun in the tag rather than repeating the full noun phrase.
examples:
  - I finished the migration. Did you?
  - The service is ready, isn't it?
recognition_drills:
  - Choose the correct reply question for four statements with different auxiliaries.
production_drills:
  - Add a natural reply question or question tag to an original statement.
speaking_drills:
  - Respond naturally when I tell you one short fact about my day.
related:
  - grammar.auxiliary-short-forms
  - grammar.too-either-so-neither
