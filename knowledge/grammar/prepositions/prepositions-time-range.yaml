id: grammar.prepositions-time-range
title: From/To, Until, Since and For
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 104
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use from...to for a range, until for an end point, since for a starting point continuing to a reference
  time, and for for duration.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main From/To, Until, Since and For distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates From/To, Until, Since and For; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits From/To, Until, Since and For without naming the
  grammar point in the question.
