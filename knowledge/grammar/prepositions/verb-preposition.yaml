id: grammar.verb-preposition
title: Verb + Preposition
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 113
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Learn common verb + preposition combinations such as listening to or looking at as fixed patterns.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Verb + Preposition distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Verb + Preposition; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Verb + Preposition without naming the grammar point
  in the question.
related:
