id: grammar.prepositions-movement-to-in-at
title: 'Movement and Destination: To, In, At'
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 108
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use to for movement toward a destination, while in/at normally describe position; some destinations
  such as home use no to.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- 'Generate two original sentences that differ on the main Movement and Destination: To, In, At distinction and
  ask the learner to choose the natural/correct one.'
production_drills:
- 'Ask for one original sentence that demonstrates Movement and Destination: To, In, At; add a negative/question
  transformation when that form is relevant.'
speaking_drills:
- 'Ask one short everyday or work question that naturally elicits Movement and Destination: To, In, At without naming
  the grammar point in the question.'
