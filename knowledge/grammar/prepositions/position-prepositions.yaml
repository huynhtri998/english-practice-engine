id: grammar.position-prepositions
title: Position Prepositions
kind: grammar
level: elementary
category: grammar.prepositions
status: expanded
source_refs:
  - source: egiu-4e
    units: [109]
source_coverage: Unit 109 source position relations such as next to/beside/by, in front of, behind, between, opposite, above/below/under and left/right/middle are represented.
core_concept: Position prepositions describe the spatial relationship between one thing and a reference point.
mental_model: Choose the reference object first, then describe relative direction or adjacency.
key_items:
  - next to / beside / by
  - in front of
  - behind
  - between
  - opposite
  - above
  - below
  - under
  - on the left / right
  - in the middle of
common_mistakes:
  - Keep in front of as a complete chunk; it differs from in the front of, which refers to an internal area.
examples:
  - The pharmacy is opposite the station.
  - My desk is between the window and the door.
recognition_drills:
  - Choose the position phrase from simple spatial descriptions.
production_drills:
  - Describe a room or street map using six position relations.
speaking_drills:
  - What's next to your desk, and what's in front of you right now?
