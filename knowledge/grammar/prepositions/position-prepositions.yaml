id: grammar.position-prepositions
title: Position Prepositions
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 109
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use prepositions such as under, behind, in front of, opposite, between and next to to describe relative
  position.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Position Prepositions distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Position Prepositions; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Position Prepositions without naming the grammar
  point in the question.
