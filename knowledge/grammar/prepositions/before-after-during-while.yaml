id: grammar.before-after-during-while
title: Before, After, During and While
kind: grammar
level: elementary
category: grammar.prepositions
status: expanded
source_refs:
  - source: egiu-4e
    units: [105]
source_coverage: Unit 105 before/after with nouns or clauses, during + noun, while + clause, for + duration, and before/after + -ing are represented.
core_concept: Use during before a noun/event period, while before a clause, and before/after to order events; use for, not during, to measure duration.
mental_model: Event label -> during; subject + verb happening simultaneously -> while; sequence -> before/after; measured length -> for.
forms:
  during: during + noun
  while: while + subject + verb
  before_after_clause: before/after + clause
  before_after_ing: before/after + -ing
contrasts:
  during_vs_while: during introduces a noun phrase; while introduces a clause
  during_vs_for: during identifies the event/period; for measures its length
common_mistakes:
  - Do not say during we were eating; use while we were eating.
  - After before/after used as prepositions, use -ing rather than to-infinitive.
examples:
  - I took notes during the meeting while my teammate was presenting.
  - After finishing work, I went for a walk.
recognition_drills:
  - Choose during/while/for/before/after based on the following grammar and meaning.
production_drills:
  - Join events using one simultaneous and one sequence pattern.
speaking_drills:
  - What do you usually do before starting work and after finishing?
