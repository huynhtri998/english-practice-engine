id: grammar.before-after-during-while
title: Before, After, During and While
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 105
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use before/after for sequence, during + noun for a period, and while + clause for simultaneous activity.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Before, After, During and While distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Before, After, During and While; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Before, After, During and While without naming
  the grammar point in the question.
contrasts:
- during + noun/noun phrase
- while + subject + verb
