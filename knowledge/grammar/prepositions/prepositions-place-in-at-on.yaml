id: grammar.prepositions-place-in-at-on
title: In, At and On for Place
kind: grammar
level: elementary
category: grammar.prepositions
status: expanded
source_refs:
  - source: egiu-4e
    units: [106, 107]
source_coverage: Units 106-107 core container/area, point/event/institution, surface/transport/floor patterns and common fixed place expressions are represented.
core_concept: In commonly places something inside an area/container, at treats a location as a point/activity place, and on places something on a surface/line or certain public transport/floors.
mental_model: Inside area/container -> in; point/event/activity location -> at; surface/line/public transport layer -> on.
usage:
  - in a room/city/country, in bed/hospital/the sky/a photo/a car
  - at home/work/school/university/station/airport/a person's house/event
  - on a wall/floor/shelf, on a bus/train/plane/ship, on a floor, on the way
  - in and at can both be possible for some buildings depending on viewpoint
common_mistakes:
  - Learn common place chunks as units because literal physical logic does not explain every fixed pattern.
  - Distinguish in a car/taxi from on a bus/train/plane in the source patterns.
examples:
  - I met her at the station and we talked on the train.
  - My laptop is on the desk in the living room.
recognition_drills:
  - Choose in/at/on for a mix of containers, events, institutions, surfaces and transport.
production_drills:
  - Describe where five objects/people are using varied place patterns.
speaking_drills:
  - Where do you usually work, and where is your computer when you work at home?
