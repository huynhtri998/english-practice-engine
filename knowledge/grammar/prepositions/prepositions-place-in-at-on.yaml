id: grammar.prepositions-place-in-at-on
title: 'Place Prepositions: In, At, On'
kind: grammar
level: elementary
category: grammar.prepositions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 106
  - 107
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use in, at and on for common location patterns; the choice depends on whether the place is viewed
  as an area/container, a point/event, or a surface/line.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- 'Generate two original sentences that differ on the main Place Prepositions: In, At, On distinction and ask the
  learner to choose the natural/correct one.'
production_drills:
- 'Ask for one original sentence that demonstrates Place Prepositions: In, At, On; add a negative/question transformation
  when that form is relevant.'
speaking_drills:
- 'Ask one short everyday or work question that naturally elicits Place Prepositions: In, At, On without naming
  the grammar point in the question.'
