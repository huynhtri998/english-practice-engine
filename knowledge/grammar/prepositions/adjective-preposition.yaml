id: grammar.adjective-preposition
title: Adjective + Preposition Patterns
kind: grammar
level: elementary
category: grammar.prepositions
status: expanded
source_refs:
  - source: egiu-4e
    units: [112]
source_coverage: Unit 112 common adjective-preposition combinations and preposition + -ing grammar are represented.
core_concept: Learn adjective-preposition combinations as chunks; when a verb follows a preposition, use the -ing form in these patterns.
mental_model: Retrieve adjective + its partner preposition together, then if an action follows, convert the verb to -ing.
collocations:
  - afraid/scared of
  - angry with somebody / about something
  - different from/to
  - fed up with
  - full of
  - good at
  - interested in
  - married to
  - nice/kind of somebody to do; nice/kind to somebody
  - sorry about a situation
  - sorry for/about doing something
  - feel sorry for somebody
common_mistakes:
  - After a preposition, use -ing rather than a to-infinitive in the source patterns.
  - Say married to, not married with.
examples:
  - I'm interested in learning more about architecture.
  - She is good at explaining difficult ideas.
recognition_drills:
  - Supply the missing preposition and choose noun versus -ing form after it.
production_drills:
  - Make personal sentences with five adjective-preposition chunks.
speaking_drills:
  - What are you interested in learning, and what are you good at doing?
