id: grammar.movement-prepositions
title: Movement Prepositions
kind: grammar
level: elementary
category: grammar.prepositions
status: expanded
source_refs:
  - source: egiu-4e
    units: [110]
source_coverage: Unit 110 movement paths including up/down, over/under, through, round/around, along, across, past, into and out of are represented.
core_concept: Movement prepositions describe the path an action takes relative to places and objects.
mental_model: Visualize the path: vertical, boundary crossing, interior passage, perimeter, line, side-to-side, passing a landmark, entering or leaving.
key_items:
  - up / down
  - over / under
  - through
  - round / around
  - along
  - across
  - past
  - into
  - out of
common_mistakes:
  - Across describes movement from one side to another; through describes movement within/inside and out of a space or opening.
  - Into focuses on movement to the inside; in often describes location.
examples:
  - Walk along this road, go past the bank and turn left.
  - The dog ran across the road and into the garden.
recognition_drills:
  - Match movement paths to the correct preposition.
production_drills:
  - Give original directions using at least five movement prepositions.
speaking_drills:
  - Explain how to walk from your home to a nearby place.
