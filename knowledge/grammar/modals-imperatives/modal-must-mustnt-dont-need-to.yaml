id: grammar.modal-must-mustnt-dont-need-to
title: Must, Mustn't and Don't Need To
kind: grammar
level: elementary
category: grammar.modals
status: expanded
source_refs:
  - source: egiu-4e
    units: [31]
source_coverage: Unit 31 covers must for necessity, had to for past necessity, mustn't for prohibition/necessary not to, and don't need to/don't have to for absence of necessity.
core_concept: Must expresses necessity; mustn't means "do not do it"; don't need to means the action is optional because it is not necessary.
mental_model: must = necessary to do; mustn't = necessary not to do; don't need to = no necessity either way.
forms:
  necessity: must + base verb
  prohibition: must not/mustn't + base verb
  no_necessity: don't/doesn't need to + base verb
  past_necessity: had to + base verb
contrasts:
  mustnt_vs_dont_need_to: mustn't prohibits the action; don't need to permits it but says it is unnecessary
common_mistakes:
  - Do not use must for the source's past-necessity pattern; use had to.
  - Do not confuse mustn't with don't need to.
examples:
  - I must finish this before the meeting.
  - You mustn't commit the PDF to Git.
  - You don't need to build an app yet.
recognition_drills:
  - Choose mustn't or don't need to based on whether an action is forbidden or merely unnecessary.
production_drills:
  - Make one necessary, one prohibited and one optional sentence.
speaking_drills:
  - What must you do before you finish work today?
related:
  - grammar.have-to
  - grammar.modal-should
