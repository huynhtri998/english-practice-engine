id: grammar.modal-can-could
title: Can and Could
kind: grammar
level: elementary
category: grammar.modals-imperatives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 30
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use can for present ability/possibility/permission and could for past ability or more tentative/polite
  uses.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Can and Could distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Can and Could; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Can and Could without naming the grammar point
  in the question.
forms:
  form: subject + can/could + base verb
