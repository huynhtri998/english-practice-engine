id: grammar.used-to
title: Used To
kind: grammar
level: elementary
category: grammar.modals
status: expanded
source_refs:
  - source: egiu-4e
    units: [36]
source_coverage: Unit 36 covers used to + base verb for a past state/habit that is no longer true, plus didn't use to and Did ... use to ...?; it explicitly distinguishes present usually from used to.
core_concept: Use used to + base verb for a past habit or state that was true before but is not true now.
mental_model: Old normal -> changed now.
forms:
  affirmative: used to + base verb
  negative: didn't use to + base verb
  question: Did + subject + use to + base verb?
usage:
  - repeated past habits that have changed
  - past states that are no longer true
contrasts:
  present_habit: use present simple/frequency words such as usually for a current routine, not use to
common_mistakes:
  - After did/didn't, write use to in the source pattern.
  - Do not use "I use to" for a present habit.
examples:
  - I used to translate sentences in my head more often.
  - I didn't use to practise speaking every day.
recognition_drills:
  - Choose used to or usually for a changed past habit versus a current routine.
production_drills:
  - Make one sentence about an old habit that is different now.
speaking_drills:
  - What did you use to do differently when you first learned English?
related:
  - grammar.past-simple
  - grammar.frequency-adverbs
