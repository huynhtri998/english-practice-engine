id: grammar.would-like
title: Would Like
kind: grammar
level: elementary
category: grammar.modals
status: expanded
source_refs:
  - source: egiu-4e
    units: [34]
source_coverage: Unit 34 covers Would you like...? for offers, Would you like to...? for invitations, I'd like as a polite want-pattern, and contrasts these with Do you like...? for general preference.
core_concept: Use would like for a present offer, invitation or polite desire; use do you like/like for general preference.
mental_model: This occasion/request -> would like; in general -> like.
forms:
  offer: Would you like + noun?
  invitation: Would you like to + base verb?
  desire: I'd/I would like + noun or to + base verb
usage:
  - offer something
  - invite somebody to do something
  - politely ask for or say what you want
contrasts:
  would_like_vs_like: would like asks/wants something in the current situation; like describes general preference
common_mistakes:
  - Use to + base verb after would like when an action follows.
  - Do not answer a current offer with a general-preference pattern when the intended meaning is accepting/refusing now.
examples:
  - Would you like some coffee?
  - Would you like to practise for ten minutes?
  - I'd like to improve my speaking reflex.
recognition_drills:
  - Choose Do you like...? or Would you like...? for general preference versus a current offer.
production_drills:
  - Make one polite request and one invitation using would like.
speaking_drills:
  - What would you like to improve in your English next?
related:
  - grammar.infinitive-vs-ing
  - grammar.object-plus-infinitive
