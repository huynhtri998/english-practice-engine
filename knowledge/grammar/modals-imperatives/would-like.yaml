id: grammar.would-like
title: Would Like
kind: grammar
level: elementary
category: grammar.modals-imperatives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 34
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use would like for polite wants, offers and invitations; use would like + to-infinitive for desired
  actions.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Would Like distinction and ask the learner to choose the
  natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Would Like; add a negative/question transformation when that form
  is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Would Like without naming the grammar point in
  the question.
forms:
  noun: would like + noun
  action: would like + to-infinitive
