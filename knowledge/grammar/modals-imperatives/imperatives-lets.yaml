id: grammar.imperatives-lets
title: Imperatives and Let's
kind: grammar
level: elementary
category: grammar.modals-imperatives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 35
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use the base verb for commands/instructions, don't + base verb for negative commands, and let's for
  suggestions that include the speaker.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Imperatives and Let's distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Imperatives and Let's; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Imperatives and Let's without naming the grammar
  point in the question.
forms:
  command: base verb
  negative_command: don't + base verb
  suggestion: let's + base verb
