id: grammar.have-to
title: Have To
kind: grammar
level: elementary
category: grammar.modals-imperatives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 33
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use have to for necessity, changing its form for person and tense; negatives express lack of necessity.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Have To distinction and ask the learner to choose the
  natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Have To; add a negative/question transformation when that form
  is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Have To without naming the grammar point in the
  question.
forms:
  form: have/has to + base verb; past had to
