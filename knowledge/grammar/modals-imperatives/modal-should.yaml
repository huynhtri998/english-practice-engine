id: grammar.modal-should
title: Should
kind: grammar
level: elementary
category: grammar.modals-imperatives
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 32
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use should + base verb for advice, recommendations and what is a good or expected thing to do.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Should distinction and ask the learner to choose the natural/correct
  one.
production_drills:
- Ask for one original sentence that demonstrates Should; add a negative/question transformation when that form
  is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Should without naming the grammar point in the
  question.
forms:
  form: subject + should + base verb
