id: grammar.future-going-to
title: Be Going To
kind: grammar
level: elementary
category: grammar.future
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 26
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use be going to + base verb for plans/intentions and for predictions based on present evidence.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Be Going To distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Be Going To; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Be Going To without naming the grammar point in
  the question.
forms:
  form: subject + am/is/are going to + base verb
related:
- grammar.future-present-continuous-arrangements
- grammar.future-will-shall
