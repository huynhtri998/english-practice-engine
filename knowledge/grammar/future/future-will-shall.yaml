id: grammar.future-will-shall
title: Will and Shall
kind: grammar
level: elementary
category: grammar.future
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 27
  - 28
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use will for future statements, predictions, decisions and offers; shall is used mainly with I/we
  in a limited set of questions or suggestions at this level.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Will and Shall distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Will and Shall; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Will and Shall without naming the grammar point
  in the question.
forms:
  form: subject + will + base verb
  negative: won't + base verb
related:
- grammar.future-going-to
- grammar.future-present-continuous-arrangements
