id: grammar.future-present-continuous-arrangements
title: Present Continuous for Future Arrangements
kind: grammar
level: elementary
category: grammar.future
status: expanded
source_refs:
  - source: egiu-4e
    units: [25]
source_coverage: Unit 25 covers present continuous for arranged future plans and contrasts it with present simple for timetables/programmes.
core_concept: Use present continuous for a future arrangement that has already been organised; use present simple for fixed timetables and programmes.
mental_model: Person's arranged plan -> present continuous; timetable/system schedule -> present simple.
forms:
  arrangement: am/is/are + verb-ing + future time
  timetable: present simple + future time
usage:
  - appointments, meetings and arranged social plans
  - questions about somebody's arranged plans
contrasts:
  present_continuous: arranged personal plan
  present_simple: timetable, programme, train/bus schedule
common_mistakes:
  - Do not use ordinary present simple for a personal arrangement in the source contrast.
  - Do not assume every future sentence needs will.
examples:
  - I'm meeting the team tomorrow morning.
  - The train leaves at 7:30.
recognition_drills:
  - Choose between present continuous and present simple for an appointment versus a timetable.
production_drills:
  - Say one arranged plan for tomorrow and one scheduled event using the appropriate form.
speaking_drills:
  - What are you doing tomorrow evening?
related:
  - grammar.future-going-to
  - grammar.future-will-shall
  - grammar.present-continuous
