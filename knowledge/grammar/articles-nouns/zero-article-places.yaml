id: grammar.zero-article-places
title: Articles with Common Places
kind: grammar
level: elementary
category: grammar.articles-nouns
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 71
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Learn fixed patterns such as going to work/home and when common public places use or omit the article.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Articles with Common Places distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Articles with Common Places; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Articles with Common Places without naming the
  grammar point in the question.
