id: grammar.zero-article-places
title: Articles with Common Places and Activities
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [71]
source_coverage: Unit 71 work/school/university/hospital/prison/church/bed/home zero-article patterns and contrasted the-places are represented.
core_concept: Some institutional/activity expressions use no article, while ordinary destination places such as the cinema/bank/station normally use the.
mental_model: Institution/activity as its normal purpose -> often no article; ordinary identifiable place -> the.
key_items:
  - go to work / be at work
  - go to school / be at school
  - go to university
  - go to hospital / be in hospital
  - go to prison
  - go to bed / be in bed
  - go home / be at home
  - go to the cinema / bank / station / airport
common_mistakes:
  - Say go home, not go to home.
examples:
  - I finish work at five.
  - We went to the cinema after dinner.
recognition_drills:
  - Choose whether the is required with common destinations.
production_drills:
  - Correct article/preposition errors in place expressions.
speaking_drills:
  - Where do you usually go after work?
