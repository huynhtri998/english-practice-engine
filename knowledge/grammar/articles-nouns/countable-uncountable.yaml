id: grammar.countable-uncountable
title: Countable and Uncountable Nouns
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [67, 68]
source_coverage: Units 67-68 countability, a/an vs some, quantity containers, dual-use nouns and common uncountables are represented.
core_concept: Countable nouns can be counted and have singular/plural forms; uncountables normally use one mass form and not a/an.
mental_model: Ask 'Can I count individual units directly?' If not, use a quantity/container expression when a unit is needed.
forms:
  singular_countable: a/an + noun
  plural_countable: some/many + plural noun
  uncountable: some/much + noun
  measured_uncountable: a piece/bottle/cup/etc. of + noun
common_mistakes:
  - Source highlights advice, bread, furniture, hair, information, news, weather and work as usually uncountable.
  - Say a job, but not a work for employment.
examples:
  - I need some information, not an information.
  - We bought a loaf of bread and some cheese.
recognition_drills:
  - Classify nouns and choose a/an, some or a quantity expression.
production_drills:
  - Correct six countability mistakes.
speaking_drills:
  - Tell me what food and information you need for a trip.
