id: grammar.countable-uncountable
title: Countable and Uncountable Nouns
kind: grammar
level: elementary
category: grammar.articles-nouns
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 67
  - 68
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Countable nouns can be singular/plural and take numbers; uncountable nouns are not normally plural
  and use quantity expressions such as some or a ... of.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Countable and Uncountable Nouns distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Countable and Uncountable Nouns; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Countable and Uncountable Nouns without naming
  the grammar point in the question.
