id: grammar.nouns-singular-plural
title: Singular and Plural Nouns
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [66]
source_coverage: Unit 66 regular plural spelling plus common irregular/plural-only noun behavior is represented.
core_concept: Match noun number with form and verb; learn irregular plurals and nouns that are normally plural.
mental_model: Quantity first -> singular/plural form -> matching determiner and verb.
forms:
  regular: -s/-es
  common_irregular: [man-men, woman-women, child-children, foot-feet, tooth-teeth, person-people]
common_mistakes:
  - Do not add regular -s to irregular plurals such as children or people.
examples:
  - These knives are sharp.
  - Two people are waiting outside.
recognition_drills:
  - Correct plural and agreement errors.
production_drills:
  - Change singular noun phrases into plural ones.
speaking_drills:
  - Name three things around you in singular and plural.
