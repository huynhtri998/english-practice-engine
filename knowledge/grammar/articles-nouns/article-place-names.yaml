id: grammar.article-place-names
title: The in Names of Places
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [73]
source_coverage: Unit 73 article patterns for place names are represented at elementary level.
core_concept: Most simple country/city names take no article, while several geographical/group names use the.
mental_model: Learn place names in chunks, especially exceptions that include the.
usage:
  - no article with most countries/cities
  - the with many rivers, seas/oceans and plural/group names
  - source-level fixed names such as the United States / the UK
common_mistakes:
  - Do not add the automatically before every country or city.
examples:
  - She moved to Canada, then visited the United States.
recognition_drills:
  - Choose the/no article with mixed place names.
production_drills:
  - Write five travel sentences using place-name articles accurately.
speaking_drills:
  - Name three countries and one river or sea you know.
