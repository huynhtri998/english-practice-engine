id: grammar.articles-a-an-the
title: A/An and The
kind: grammar
level: elementary
category: grammar.articles-nouns
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 69
  - 70
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use a/an when introducing or referring to one non-specific singular countable thing, and the when
  the listener can identify the specific thing.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main A/An and The distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates A/An and The; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits A/An and The without naming the grammar point in
  the question.
