id: grammar.articles-a-an-the
title: A/An and The
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [69, 70]
source_coverage: Units 69-70 first/non-specific mention versus identifiable/specific reference, unique things and fixed the-patterns are represented.
core_concept: Use a/an when introducing one non-specific singular countable item; use the when the listener can identify the intended item.
mental_model: New/one-of-many -> a/an. Known/clear/unique -> the.
usage:
  - first mention vs later reference
  - unique/contextually obvious things
  - the same, the top/end/middle/left/right
  - musical instruments in play the ... patterns
common_mistakes:
  - Source omits the before TV, meals, and next/last + time expressions in the taught patterns.
examples:
  - I saw a bug in the log. The bug was easy to reproduce.
  - She plays the piano.
recognition_drills:
  - Choose a/an/the/no article in source-level contexts.
production_drills:
  - Write a two-sentence mini-story introducing and then referring back to a noun.
speaking_drills:
  - Describe a place using one first mention and one known reference.
