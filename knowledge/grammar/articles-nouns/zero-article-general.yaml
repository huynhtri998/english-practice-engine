id: grammar.zero-article-general
title: Zero Article for General Ideas
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [72]
source_coverage: Unit 72 general plural/uncountable ideas and no-the patterns for sports, languages and subjects are represented.
core_concept: Do not use the when talking about things in general with plural or uncountable nouns; use the when referring to a specific known set/item.
mental_model: Category/general idea -> no the. Identifiable instance/set -> the.
usage:
  - general food/material/ideas
  - sports
  - languages and school subjects
common_mistakes:
  - Say I like music and I play basketball for general meanings, not the music/the basketball.
examples:
  - I like coffee, but the coffee here is too strong.
recognition_drills:
  - Decide whether a noun is general or specific and choose the/no article.
production_drills:
  - Create pairs contrasting a general noun with a specific one.
speaking_drills:
  - What music, sports or subjects do you like?
