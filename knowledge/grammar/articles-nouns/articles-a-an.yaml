id: grammar.articles-a-an
title: A and An
kind: grammar
level: elementary
category: grammar.articles-nouns
status: expanded
source_refs:
  - source: egiu-4e
    units: [65]
source_coverage: Unit 65 a/an with singular countable nouns, sound-based choice, classification and jobs is represented.
core_concept: Use a/an for one non-specific singular countable thing/person and when classifying what someone/something is.
mental_model: One countable item, not uniquely identified -> a/an; choose by sound, not spelling.
forms:
  a: before consonant sound
  an: before vowel sound
usage:
  - jobs and identities
  - first/non-specific mention
  - another = an + other
common_mistakes:
  - Say an hour but a university because the choice follows pronunciation.
  - Use an article with singular jobs: She's an engineer.
examples:
  - I need a new keyboard.
  - He's an architect.
recognition_drills:
  - Choose a/an based on pronunciation in mixed examples.
production_drills:
  - Describe five jobs/things using a/an correctly.
speaking_drills:
  - What's your job? Answer with a natural a/an phrase.
