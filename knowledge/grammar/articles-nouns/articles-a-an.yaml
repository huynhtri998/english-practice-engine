id: grammar.articles-a-an
title: A and An
kind: grammar
level: elementary
category: grammar.articles-nouns
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 65
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use a/an with a singular countable noun when it is one non-specific example; choose an before a vowel
  sound.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main A and An distinction and ask the learner to choose the
  natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates A and An; add a negative/question transformation when that form
  is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits A and An without naming the grammar point in the
  question.
forms:
  form: a/an + singular countable noun
