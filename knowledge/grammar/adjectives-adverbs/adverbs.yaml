id: grammar.adverbs
title: Adverbs
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [86]
source_coverage: Unit 86 -ly adverbs, adjective/adverb contrast, hard/fast/late/early and good/well are represented.
core_concept: Adverbs describe how actions happen; many are adjective + -ly, but several common forms are irregular or unchanged.
mental_model: Describing a thing/person -> adjective; describing an action -> usually adverb.
forms:
  regular: adjective + -ly
  unchanged: [hard, fast, late, early]
  irregular: good -> well
common_mistakes:
  - Say work hard, not work hardly, for 'with effort'.
  - Say speak English well, not speak English good.
  - Well can also be an adjective meaning healthy.
examples:
  - The service started slowly but recovered quickly.
  - She explained the issue very well.
recognition_drills:
  - Choose adjective or adverb, including hard/fast/good/well cases.
production_drills:
  - Transform adjective prompts into natural action descriptions.
speaking_drills:
  - What is something you do well, and something you do slowly?
