id: grammar.adjectives
title: Adjectives
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [85]
source_coverage: Unit 85 adjective-before-noun and adjective-after be/look/feel/sound/smell/taste patterns are represented.
core_concept: Adjectives describe nouns and also follow linking verbs that describe a subject's state or impression.
mental_model: Describe a noun directly before it, or describe the subject after a linking verb.
forms:
  attributive: adjective + noun
  linking: be/look/feel/sound/smell/taste + adjective
common_mistakes:
  - Use an adjective after look/feel/sound/taste when describing the subject, not an adverb.
examples:
  - That's a difficult problem.
  - The plan sounds reasonable, but I feel tired.
recognition_drills:
  - Choose adjective/adverb in linking-verb contexts.
production_drills:
  - Describe five things using both adjective positions.
speaking_drills:
  - How do you feel today, and how does your current project sound to you?
