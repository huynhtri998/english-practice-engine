id: grammar.adjectives
title: Adjectives
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 85
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use adjectives to describe nouns or after linking verbs such as be; adjectives do not change for plural
  nouns.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Adjectives distinction and ask the learner to choose the
  natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Adjectives; add a negative/question transformation when that form
  is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Adjectives without naming the grammar point in
  the question.
