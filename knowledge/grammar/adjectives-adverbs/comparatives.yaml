id: grammar.comparatives
title: Comparatives
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 87
  - 88
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Form comparative adjectives with -er or more and use than when explicitly comparing two things.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Comparatives distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Comparatives; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Comparatives without naming the grammar point in
  the question.
forms:
  short_adjective: adjective-er (+ than)
  long_adjective: more + adjective (+ than)
prerequisites:
- grammar.adjectives
