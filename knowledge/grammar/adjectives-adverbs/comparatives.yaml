id: grammar.comparatives
title: Comparatives
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [87, 88]
source_coverage: Units 87-88 comparative formation, irregular forms, than, pronoun/clause alternatives and degree modifiers are represented.
core_concept: Form comparisons with -er for many short adjectives and more for longer ones, then use than to name the comparison target.
mental_model: Property -> comparative form -> than + reference point.
forms:
  short: adjective + -er
  y_ending: -y -> -ier
  long: more + adjective
  irregular: [good/well -> better, bad -> worse, far -> further]
usage:
  - than + object pronoun or full comparison clause
  - a bit/much + comparative for degree
  - more/less than for quantities
common_mistakes:
  - Avoid more older/more cheaper.
examples:
  - This query is much faster than the old one.
  - The new approach is a bit more expensive but safer.
recognition_drills:
  - Form regular/irregular comparatives and choose the natural than-structure.
production_drills:
  - Compare two tools using three different comparative patterns.
speaking_drills:
  - Is working remotely easier or harder than working in the office for you?
