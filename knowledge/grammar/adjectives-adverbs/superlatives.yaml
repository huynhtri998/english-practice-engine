id: grammar.superlatives
title: Superlatives
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [90]
source_coverage: Unit 90 -est/most formation, irregular superlatives, the, in/of groups and ever patterns are represented.
core_concept: Use a superlative to identify the highest/lowest member of a group, normally with the.
mental_model: Compare one item against the whole group -> the + superlative.
forms:
  short: the + adjective-est
  long: the most + adjective
  irregular: [good -> best, bad -> worst, far -> furthest]
usage:
  - in + place/group area
  - of + set/time group
  - the best/worst ... ever for experience
common_mistakes:
  - Use the before normal superlative noun phrases.
examples:
  - That's the fastest build we've had this week.
  - It was the most useful lesson of the course.
recognition_drills:
  - Choose comparative or superlative and form it correctly.
production_drills:
  - Describe the best, hardest and most interesting parts of your week.
speaking_drills:
  - What's the most useful English habit you've tried?
