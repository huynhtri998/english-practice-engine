id: grammar.not-as-as
title: Not As ... As
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 89
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use not as + adjective/adverb + as to say two things are unequal in a particular quality.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Not As ... As distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Not As ... As; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Not As ... As without naming the grammar point
  in the question.
forms:
  form: not as + adjective/adverb + as
