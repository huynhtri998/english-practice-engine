id: grammar.not-as-as
title: Not As ... As
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [89]
source_coverage: Unit 89 equality/inequality comparison with as ... as and related amount patterns is represented.
core_concept: Use as + adjective/adverb + as for equality and not as ... as for a lower degree.
mental_model: Same degree -> as ... as; lower degree -> not as ... as.
forms:
  equality: as + adjective/adverb + as
  inequality: not as + adjective/adverb + as
usage:
  - can compare actions as well as qualities
  - quantity parallels include not as much/many as
examples:
  - This solution isn't as simple as the first one.
  - I don't type as fast as my teammate does.
recognition_drills:
  - Rewrite comparative sentences using not as ... as.
production_drills:
  - Compare two routines with as/not as ... as.
speaking_drills:
  - Is speaking English as easy for you as reading it?
