id: grammar.too
title: Too
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [92]
source_coverage: Unit 92 too + adjective/adverb, too much/many, too ... to and contrast with enough are represented.
core_concept: Too expresses more than is wanted/acceptable, often causing a negative result.
mental_model: Excess -> too; sufficient threshold -> enough.
forms:
  quality: too + adjective/adverb
  countable: too many + plural noun
  uncountable: too much + noun
  result: too + adjective + to + verb
common_mistakes:
  - Too does not simply mean very; it implies excess relative to a need or limit.
examples:
  - The log is too large to paste here.
  - There are too many warnings and too much noise.
recognition_drills:
  - Choose too/enough and explain whether the meaning is excess or sufficiency.
production_drills:
  - Combine cause/result prompts using too ... to.
speaking_drills:
  - What makes a meeting too long for you?
