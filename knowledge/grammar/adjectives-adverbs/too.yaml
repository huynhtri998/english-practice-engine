id: grammar.too
title: Too
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 92
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use too + adjective/adverb for more than is wanted or acceptable, and too much/many for excessive
  quantities.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Too distinction and ask the learner to choose the natural/correct
  one.
production_drills:
- Ask for one original sentence that demonstrates Too; add a negative/question transformation when that form is
  relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Too without naming the grammar point in the question.
forms:
  adjective_adverb: too + adjective/adverb
  quantity: too much + uncountable; too many + plural countable
