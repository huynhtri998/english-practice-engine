id: grammar.enough
title: Enough
kind: grammar
level: elementary
category: grammar.adjectives-adverbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [91]
source_coverage: Unit 91 enough + noun, adjective/adverb + enough and enough + to/for patterns are represented.
core_concept: Enough means the required amount or degree; its position changes with nouns versus adjectives/adverbs.
mental_model: With a noun, enough goes before it; with a quality, enough goes after the adjective/adverb.
forms:
  noun: enough + noun
  adjective_adverb: adjective/adverb + enough
  result: enough + noun + to; adjective + enough + to
common_mistakes:
  - Say big enough, not enough big.
examples:
  - We have enough time to run the tests.
  - The explanation was clear enough to follow.
recognition_drills:
  - Put enough in the correct position.
production_drills:
  - Combine two facts using enough + to.
speaking_drills:
  - Do you have enough time to practise English today?
