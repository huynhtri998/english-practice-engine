source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Recognize and form common present and past forms of be, have and do, which also act as important auxiliaries.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Be, Have and Do Across Tenses distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Be, Have and Do Across Tenses; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Be, Have and Do Across Tenses without naming the
  grammar point in the question.
