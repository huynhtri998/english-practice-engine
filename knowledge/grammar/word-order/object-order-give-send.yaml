id: grammar.object-order-give-send
title: Object Order with Give/Send/Show
kind: grammar
level: elementary
category: grammar.word-order
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 96
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: With certain verbs, use either verb + person + thing or verb + thing + to person; object pronouns
  influence which pattern sounds natural.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Object Order with Give/Send/Show distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Object Order with Give/Send/Show; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Object Order with Give/Send/Show without naming
  the grammar point in the question.
