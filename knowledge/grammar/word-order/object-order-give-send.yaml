id: grammar.object-order-give-send
title: Object Order with Give, Send, Show and Similar Verbs
kind: grammar
level: elementary
category: grammar.word-order
status: expanded
source_refs:
  - source: egiu-4e
    units: [96]
source_coverage: Unit 96 two-object structures, to/for alternatives and pronoun preference are represented.
core_concept: Many transfer verbs allow either thing + to + person or person + thing; with it/them, the thing + to + person structure is preferred in the source.
mental_model: Transfer: WHAT to WHOM, or WHOM WHAT. Pronoun object it/them strongly favors WHAT to WHOM.
forms:
  prepositional: verb + thing + to + person
  double_object: verb + person + thing
  benefactive: buy/get + person + thing = buy/get + thing + for + person
common_mistakes:
  - Do not say give to Sarah the keys.
  - Prefer give it to her, not give her it.
examples:
  - Send the report to me, or send me the report.
  - I bought my brother a present.
recognition_drills:
  - Choose the natural order for full nouns versus it/them.
production_drills:
  - Rewrite transfer sentences using the alternative structure.
speaking_drills:
  - Tell me something you recently sent or gave to someone.
