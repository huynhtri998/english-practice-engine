id: grammar.still-yet-already
title: Still, Yet and Already
kind: grammar
level: elementary
category: grammar.word-order
status: expanded
source_refs:
  - source: egiu-4e
    units: [95]
source_coverage: Unit 95 continuation, not-yet expectation, earlier-than-expected already and their normal positions are represented.
core_concept: Still marks continuation, yet marks an expected change up to now (especially questions/negatives), and already marks earlier-than-expected completion/state.
mental_model: Continues now -> still; expected but not happened / checking -> yet; happened sooner -> already.
forms:
  still: mid-position, after be
  yet: usually end position in questions/negatives
  already: mid-position or after be
contrasts:
  still_vs_yet: still describes the continuing state/action; yet focuses on whether the expected change has happened
examples:
  - I'm still reviewing the files.
  - I haven't opened the PR yet, but the migration is already far along.
recognition_drills:
  - Choose still/yet/already from timeline meaning.
production_drills:
  - Describe one ongoing, one pending and one earlier-than-expected event.
speaking_drills:
  - Is there anything you haven't finished yet today?
