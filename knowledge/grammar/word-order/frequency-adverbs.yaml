id: grammar.frequency-adverbs
title: Frequency Adverbs and Mid-position Adverbs
kind: grammar
level: elementary
category: grammar.word-order
status: expanded
source_refs:
  - source: egiu-4e
    units: [94]
source_coverage: Unit 94 always/usually/often/sometimes/rarely/never plus also/just/already/ever/still placement around auxiliaries and be is represented.
core_concept: Many short adverbs sit before the main verb but after be; with auxiliaries, they normally follow the first auxiliary.
mental_model: Find the verb group: be -> adverb after be; ordinary main verb -> adverb before it; auxiliary + main -> adverb after auxiliary.
forms:
  main_verb: subject + adverb + main verb
  be: subject + be + adverb
  auxiliary: subject + auxiliary + adverb + main verb
common_mistakes:
  - Say I usually finish at five, but I am usually home by six.
examples:
  - I usually review English after work.
  - I can never remember that preposition quickly.
recognition_drills:
  - Move adverbs to the natural mid-position.
production_drills:
  - Answer routine questions using five different frequency adverbs.
speaking_drills:
  - What do you usually do after work, and what do you rarely do?
