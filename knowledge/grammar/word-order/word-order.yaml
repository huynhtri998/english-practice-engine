id: grammar.word-order
title: Basic Word Order
kind: grammar
level: elementary
category: grammar.word-order
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 93
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Keep the basic order subject + verb + object/place/time, and place manner expressions in their normal
  sentence position.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Basic Word Order distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Basic Word Order; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Basic Word Order without naming the grammar point
  in the question.
