id: grammar.word-order
title: Basic Word Order
kind: grammar
level: elementary
category: grammar.word-order
status: expanded
source_refs:
  - source: egiu-4e
    units: [93]
source_coverage: Unit 93 verb-object adjacency and usual place-before-time ordering are represented.
core_concept: Keep verb and object together; when both place and time appear after the verb, place usually comes before time.
mental_model: subject -> verb -> object -> place -> time.
forms:
  core: subject + verb + object
  adjuncts: place + time
common_mistakes:
  - Do not normally split a verb from its object with a time phrase.
  - Put place before time in the source's neutral word order.
examples:
  - I finished the migration at home last night.
  - She explained the problem clearly.
recognition_drills:
  - Reorder scrambled sentences using verb-object-place-time.
production_drills:
  - Expand short clauses with both place and time details.
speaking_drills:
  - What did you do at work yesterday afternoon?
