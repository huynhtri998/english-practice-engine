id: grammar.first-conditional
title: First Conditional / Real Future If
kind: grammar
level: elementary
category: grammar.clauses
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 99
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use if + present form with a future/modal main clause for a real or possible future condition.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main First Conditional / Real Future If distinction and ask
  the learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates First Conditional / Real Future If; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits First Conditional / Real Future If without naming
  the grammar point in the question.
forms:
  form: if + present, ... will/can/may + base verb
prerequisites:
- grammar.present-simple
- grammar.future-will-shall
