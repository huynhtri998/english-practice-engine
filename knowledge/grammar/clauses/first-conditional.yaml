id: grammar.first-conditional
title: Real/Possible If-Clauses
kind: grammar
level: elementary
category: grammar.clauses
status: expanded
source_refs:
  - source: egiu-4e
    units: [99]
source_coverage: Unit 99 present form in real/possible if-clauses, future/result clauses and when-vs-if contrast are represented.
core_concept: Use if + present form for a real possible future condition; put will/can/imperative-type result meaning in the main clause, not normally after if.
mental_model: Condition is uncertain -> if + present; consequence -> future/command/modal as needed.
forms:
  future_result: if + present, will + base verb
  other_results: if + present, imperative/can/etc.
contrasts:
  when_vs_if: when = expected/certain timing; if = condition may or may not happen
common_mistakes:
  - Say if it rains, not if it will rain, in the source pattern.
examples:
  - If I have time tonight, I'll practise speaking.
  - When I get home, I'll eat; if I'm late, don't wait for me.
recognition_drills:
  - Choose if/when and correct will in condition clauses.
production_drills:
  - Complete realistic future conditions with your own results.
speaking_drills:
  - What will you do if you have thirty free minutes tonight?
