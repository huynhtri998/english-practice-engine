id: grammar.when-clauses
title: When Clauses
kind: grammar
level: elementary
category: grammar.clauses
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 98
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use when to connect a time clause and a main clause; future meaning in the when-clause normally uses
  a present form rather than will.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main When Clauses distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates When Clauses; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits When Clauses without naming the grammar point in
  the question.
