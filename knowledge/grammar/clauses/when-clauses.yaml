id: grammar.when-clauses
title: When, Before, After, While and Until
kind: grammar
level: elementary
category: grammar.clauses
status: expanded
source_refs:
  - source: egiu-4e
    units: [98]
source_coverage: Unit 98 time-clause connectors and future-time use without will in the time clause are represented.
core_concept: Time clauses locate one event relative to another; for future meaning, use present form in the when/before/after/until clause rather than will.
mental_model: Main event + time relationship; the time clause acts like a condition/time marker, not a future prediction clause.
usage:
  - when for the time something happens
  - before/after for sequence
  - while for simultaneous duration
  - until for continuing to an endpoint
common_mistakes:
  - For future time, say when I get home, not when I will get home.
examples:
  - I'll message you when I finish work.
  - I listened to English while I was walking.
recognition_drills:
  - Choose the connector and correct future-time will errors.
production_drills:
  - Combine two events with when/before/after/while/until.
speaking_drills:
  - What do you usually do when you finish work?
