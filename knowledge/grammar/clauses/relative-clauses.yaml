id: grammar.relative-clauses
title: Relative Clauses
kind: grammar
level: elementary
category: grammar.clauses
status: expanded
source_refs:
  - source: egiu-4e
    units: [101, 102]
source_coverage: Units 101-102 subject and object relative clauses, who/that/which choices, omission of object relative pronouns, and prepositions at the end are represented.
core_concept: Use a relative clause to identify or describe a person or thing. Use who for people and which for things; that can be used for people or things in the source patterns. When the relative word is the object, it can often be omitted.
mental_model: Join two sentences around the repeated person/thing; then ask whether that person/thing is the subject or object inside the relative clause.
forms:
  subject_relative: noun + who/that/which + verb ...
  object_relative: noun + (who/that/which) + subject + verb ...
  preposition_end: noun + (relative word) + subject + verb + preposition
usage:
  - who is usual for people
  - which is for things, not people
  - that can replace who/which in these defining clauses
  - omit the relative word when it is the object
  - where can identify a place in place-relative patterns
common_mistakes:
  - Do not omit who/that/which when it is the subject of the relative clause.
  - Do not repeat an object pronoun after an object relative clause.
  - Do not use which for people in the source pattern.
examples:
  - The engineer who fixed the issue is on my team.
  - The tool I use every day is very simple.
  - The hotel we stayed at was close to the station.
recognition_drills:
  - Decide whether the relative word is subject or object and whether it can be omitted.
production_drills:
  - Combine pairs of original sentences into relative clauses, including one with a final preposition.
speaking_drills:
  - Describe a person you work with and a tool you use often without naming the target grammar.
