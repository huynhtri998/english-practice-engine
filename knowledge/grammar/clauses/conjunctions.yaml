id: grammar.conjunctions
title: And, But, Or, So and Because
kind: grammar
level: elementary
category: grammar.clauses
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 97
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use basic conjunctions to add, contrast, offer alternatives, show results and give reasons.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main And, But, Or, So and Because distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates And, But, Or, So and Because; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits And, But, Or, So and Because without naming the
  grammar point in the question.
related:
- vocabulary.connecting-words
