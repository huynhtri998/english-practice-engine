id: grammar.conjunctions
title: And, But, Or, So and Because
kind: grammar
level: elementary
category: grammar.clauses
status: expanded
source_refs:
  - source: egiu-4e
    units: [97]
source_coverage: Unit 97 coordinating links, result with so, reason with because, list punctuation and clause joining are represented.
core_concept: Join ideas by relationship: addition with and, contrast with but, alternatives with or, result with so, reason with because.
mental_model: Ask what relationship the second idea has to the first before choosing the connector.
usage:
  - and for addition/list endings
  - but for contrast
  - or for alternatives
  - so for result
  - because for reason; because-clause can begin the sentence
common_mistakes:
  - Distinguish because (reason) from so (result).
examples:
  - The test failed, so I checked the logs.
  - I stayed late because the deployment was blocked.
recognition_drills:
  - Choose connectors by semantic relationship rather than translation alone.
production_drills:
  - Join five pairs of short clauses in different ways.
speaking_drills:
  - Why are you learning English, and what do you want to improve most?
