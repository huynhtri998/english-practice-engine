id: grammar.second-conditional
title: Second Conditional / Hypothetical If
kind: grammar
level: elementary
category: grammar.clauses
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 100
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use if + past form with would + base verb for unreal, unlikely or imagined present/future situations.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Second Conditional / Hypothetical If distinction and ask
  the learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Second Conditional / Hypothetical If; add a negative/question
  transformation when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Second Conditional / Hypothetical If without naming
  the grammar point in the question.
forms:
  form: if + past, ... would + base verb
prerequisites:
- grammar.past-simple
