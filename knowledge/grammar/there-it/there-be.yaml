id: grammar.there-be
title: There Is / There Are
kind: grammar
level: elementary
category: grammar.there-it
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 37
  - 38
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use there + be to say that something exists or is present, with present, past, perfect and future
  forms.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main There Is / There Are distinction and ask the learner to
  choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates There Is / There Are; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits There Is / There Are without naming the grammar
  point in the question.
forms:
  present: there is/are
  past: there was/were
  perfect: there has/have been
  future: there will be
