id: grammar.it
title: It as a Subject
kind: grammar
level: elementary
category: grammar.there-it
status: expanded
source_refs:
  - source: egiu-4e
    units: [39]
source_coverage: Unit 39 uses it in elementary patterns for time, day/date, weather, distance and adjective + to-infinitive statements.
core_concept: Use it as an impersonal subject in common expressions about time, weather, distance and situations.
mental_model: English still needs a grammatical subject even when the sentence is about the general situation rather than a concrete thing; use it.
usage:
  - time/day/date
  - weather and temperature
  - distance with How far is it...?
  - general evaluation with It is + adjective + to + verb
forms:
  time_weather_distance: It + be + complement
  evaluation: It + be + adjective + to + base verb
common_mistakes:
  - Do not omit the subject in English weather/time expressions.
  - Keep existential there is distinct from impersonal it is.
examples:
  - It's late now.
  - It's hot today.
  - How far is it to the station?
  - It's useful to practise every day.
recognition_drills:
  - Decide whether a fresh sentence needs existential there or impersonal it.
production_drills:
  - Make one sentence about today's weather and one about distance using it.
speaking_drills:
  - What time is it where you are, and what's the weather like?
related:
  - grammar.there-be
  - grammar.infinitive-purpose
