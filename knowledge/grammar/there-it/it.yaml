id: grammar.it
title: It as a Subject
kind: grammar
level: elementary
category: grammar.there-it
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 39
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use it as a subject for time, weather, distance and other impersonal descriptions.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main It as a Subject distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates It as a Subject; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits It as a Subject without naming the grammar point
  in the question.
