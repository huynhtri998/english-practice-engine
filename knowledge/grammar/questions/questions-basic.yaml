id: grammar.questions-basic
title: Basic Question Formation
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [44]
source_coverage: Unit 44 consolidates question order with be/auxiliaries, do/does/did support and negative questions.
core_concept: Put an existing auxiliary before the subject; for ordinary present/past simple verbs, use do/does/did before the subject.
mental_model: Question = grammar carrier first, subject second, main verb after that.
forms:
  be_or_auxiliary: auxiliary + subject + rest?
  present_simple: do/does + subject + base verb?
  past_simple: did + subject + base verb?
  negative_question: negative auxiliary + subject + rest?
common_mistakes:
  - Do not use statement order after the question word in a direct question.
  - After does/did, use the base verb.
examples:
  - Are you working today?
  - Does the service restart automatically?
  - Why didn't the test run?
recognition_drills:
  - Choose the correctly ordered direct question from two options.
production_drills:
  - Turn three statements into direct questions using different auxiliaries.
speaking_drills:
  - Ask me one natural question about my workday.
related:
  - grammar.subject-vs-object-questions
  - grammar.indirect-questions
