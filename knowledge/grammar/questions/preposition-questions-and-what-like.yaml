id: grammar.preposition-questions-and-what-like
title: Questions with Prepositions and What ... Like?
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [46]
source_coverage: Unit 46 end-position prepositions in ordinary questions and the What ... like? description pattern are represented.
core_concept: In common conversational questions, a required preposition can stay at the end; What is/are ... like? asks for a description, not a preference.
mental_model: Keep the verb-preposition pair intact even when the object becomes a question word.
forms:
  preposition_question: question word + auxiliary + subject + verb + preposition?
  description: What + be + subject + like?
common_mistakes:
  - Do not drop the preposition required by the verb.
  - Do not confuse What is it like? with Do you like it?
examples:
  - Who are you talking to?
  - What is your new project like?
recognition_drills:
  - Choose the question that keeps the required preposition and the question that asks for a description.
production_drills:
  - Ask one question ending in to/with/about and one What ... like? question.
speaking_drills:
  - What is your current project like?
related:
  - grammar.question-words
  - grammar.verb-preposition
