id: grammar.indirect-questions
title: Indirect Questions
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [49]
source_coverage: Unit 49 embedded questions after phrases such as Do you know...? / Can you tell me...? and yes/no clauses with if/whether are represented.
core_concept: Inside an indirect/embedded question, use statement word order rather than direct-question inversion; use if/whether for embedded yes/no questions.
mental_model: Only the outer phrase is the direct question; the inner clause behaves like a statement.
forms:
  wh_embedded: Do you know/Can you tell me + question word + subject + verb ...?
  yes_no_embedded: Do you know + if/whether + subject + verb ...?
common_mistakes:
  - Say "Do you know where he is?", not "where is he?" inside the embedded clause.
  - Do not add do/does/did inside the embedded clause unless it is independently required by its grammar.
examples:
  - Can you tell me where the config file is?
  - Do you know if the deployment finished?
recognition_drills:
  - Correct the word order in an embedded question.
production_drills:
  - Convert one direct wh-question and one yes/no question into polite indirect questions.
speaking_drills:
  - Ask me politely where something is or whether something happened.
related:
  - grammar.questions-basic
  - grammar.reported-speech-basic
