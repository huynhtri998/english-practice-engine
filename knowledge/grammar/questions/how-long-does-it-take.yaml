id: grammar.how-long-does-it-take
title: How Long Does It Take?
kind: grammar
level: elementary
category: grammar.questions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 48
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use How long does/did it take ...? and it takes/took ... to talk about the time needed for an activity
  or journey.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main How Long Does It Take? distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates How Long Does It Take?; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits How Long Does It Take? without naming the grammar
  point in the question.
