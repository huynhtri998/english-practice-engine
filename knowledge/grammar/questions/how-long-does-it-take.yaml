id: grammar.how-long-does-it-take
title: How Long Does It Take?
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [48]
source_coverage: Unit 48 duration questions and answers with take are represented for present, past and future contexts.
core_concept: Use How long + take to ask about the amount of time needed for a journey or action; answer with It takes/took/will take + duration.
mental_model: Activity or route -> amount of time -> take-pattern.
forms:
  present: How long does it take ...? / It takes ...
  past: How long did it take ...? / It took ...
  future: How long will it take ...? / It will take ...
  personal: It takes somebody + time + to + base verb
common_mistakes:
  - After does/did, use take, not takes/took.
examples:
  - How long does it take to run the tests?
  - It took me two hours to finish the migration.
recognition_drills:
  - Choose the correct take-form for present, past and future duration questions.
production_drills:
  - Ask and answer how long one everyday or work task takes.
speaking_drills:
  - How long does it take you to get ready for work?
related:
  - grammar.question-words
  - grammar.infinitive-purpose
