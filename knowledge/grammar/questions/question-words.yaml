id: grammar.question-words
title: What, Which and How Questions
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [47]
source_coverage: Unit 47 question-word patterns with what/which/how and how + adjective/adverb expressions are represented.
core_concept: Choose the question word from the information you need: what for open information, which for a choice from a known set, and how for manner/degree/measurement patterns.
mental_model: Decide the answer type before building the question.
forms:
  what: What + question structure?
  which: Which + noun/one + question structure?
  how_measurement:
    - How old ...?
    - How far ...?
    - How often ...?
    - How big/long/high ...?
common_mistakes:
  - Use which when choosing among a limited/identified set.
  - Keep normal question word order after the question phrase.
examples:
  - What are you learning?
  - Which branch should we use?
  - How often do you practise speaking?
recognition_drills:
  - Choose what, which or a suitable how-expression for different answer types.
production_drills:
  - Create three questions that ask for an open answer, a choice and a measurement/frequency.
speaking_drills:
  - How often do you use English at work?
related:
  - grammar.questions-basic
  - grammar.how-long-does-it-take
