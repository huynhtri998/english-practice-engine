id: grammar.question-words
title: What, Which and How Questions
kind: grammar
level: elementary
category: grammar.questions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 47
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Choose question words such as what, which and how, including common combinations like how old, how
  far and how much.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main What, Which and How Questions distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates What, Which and How Questions; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits What, Which and How Questions without naming the
  grammar point in the question.
