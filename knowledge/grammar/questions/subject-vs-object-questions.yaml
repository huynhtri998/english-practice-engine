id: grammar.subject-vs-object-questions
title: Subject vs Object Questions
kind: grammar
level: elementary
category: grammar.questions
status: expanded
source_refs:
  - source: egiu-4e
    units: [45]
source_coverage: Unit 45 contrast between who/what as subject and who/what as object is represented.
core_concept: When who/what is the subject, use normal affirmative verb order without do/does/did; when it is the object, use normal question auxiliary order.
mental_model: Ask whether the missing person/thing did the action or received the action.
forms:
  subject_question: who/what + verb + ...?
  object_question: who/what + do/does/did + subject + base verb?
common_mistakes:
  - Do not add did in a past subject question such as Who called you?
  - Use do-support when who/what is the object of an ordinary simple-tense verb.
examples:
  - Who fixed the bug?
  - Who did you call after the incident?
recognition_drills:
  - Decide whether who/what is subject or object before choosing the question form.
production_drills:
  - Write one subject question and one object question about the same event.
speaking_drills:
  - Who taught you something useful recently?
related:
  - grammar.questions-basic
  - grammar.question-words
