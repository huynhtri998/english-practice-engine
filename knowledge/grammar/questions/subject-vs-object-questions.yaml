id: grammar.subject-vs-object-questions
title: Subject vs Object Questions
kind: grammar
level: elementary
category: grammar.questions
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 45
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Do not use do/does/did when who/what is the subject; use the normal auxiliary question pattern when
  who/what is the object.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Subject vs Object Questions distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Subject vs Object Questions; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Subject vs Object Questions without naming the
  grammar point in the question.
contrasts:
- 'Subject question: who/what itself is the subject, so no do/does/did is added.'
- 'Object question: use normal auxiliary question order.'
