id: grammar.present-perfect
title: Present Perfect
kind: grammar
level: elementary
category: grammar.present-perfect
status: expanded
source_refs:
  - source: egiu-4e
    units: [15, 16, 17, 18]
source_coverage: Units 15-18 are represented: have/has + past participle, recent-result uses, just/already/yet, life experience with ever, been/gone, and how-long questions continuing to now.
core_concept: Use have/has + past participle when a past action or experience is viewed from the present rather than placed at a finished past time.
mental_model: The action is before now, but the speaker is looking from now: result now, experience up to now, or a situation continuing to now.
forms:
  affirmative: subject + have/has + past participle
  negative: subject + haven't/hasn't + past participle
  question: Have/Has + subject + past participle?
usage:
  - recent event with relevance now
  - life experience up to now
  - situations that started before now and continue now
  - just for a short time ago
  - already for earlier than expected
  - yet in negatives and questions, usually at the end
contrasts:
  gone_vs_been:
    gone: the person went and is still away
    been: the person went there and has returned, or has the experience
common_mistakes:
  - Use the past participle, not the past-simple form when they differ.
  - Keep yet mainly in negative sentences and questions in the source pattern.
  - Do not add a finished past-time expression when the intended contrast requires past simple.
examples:
  - I've just finished the migration batch.
  - Have you ever worked with Kubernetes?
  - She hasn't replied yet.
recognition_drills:
  - Choose between just, already and yet in three fresh present-perfect contexts.
production_drills:
  - Answer "Have you ever ...?" with a full sentence, then make a new sentence with just or yet.
speaking_drills:
  - Have you ever deployed a service to Kubernetes?
related:
  - grammar.for-since-ago
  - grammar.present-perfect-vs-past-simple
