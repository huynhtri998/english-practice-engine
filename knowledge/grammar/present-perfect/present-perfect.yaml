id: grammar.present-perfect
title: Present Perfect
kind: grammar
level: elementary
category: grammar.present-perfect
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 15
  - 16
  - 17
  - 18
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use have/has + past participle to connect past experience or action with the present, including recent
  events, life experience and situations continuing until now.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Present Perfect distinction and ask the learner to choose
  the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Present Perfect; add a negative/question transformation when that
  form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Present Perfect without naming the grammar point
  in the question.
forms:
  form: subject + have/has + past participle
  negative: haven't/hasn't + past participle
  question: have/has + subject + past participle?
related:
- grammar.for-since-ago
- grammar.present-perfect-vs-past-simple
