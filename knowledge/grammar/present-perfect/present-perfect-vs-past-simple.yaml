id: grammar.present-perfect-vs-past-simple
title: Present Perfect vs Past Simple
kind: grammar
level: elementary
category: grammar.present-perfect
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 20
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use present perfect without a finished past time when the past connects to now; use past simple with
  a finished past time or completed past period.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Present Perfect vs Past Simple distinction and ask the
  learner to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Present Perfect vs Past Simple; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Present Perfect vs Past Simple without naming the
  grammar point in the question.
contrasts:
- 'Present perfect: past connected to now, without a finished past-time frame.'
- 'Past simple: completed event in a finished past-time frame.'
