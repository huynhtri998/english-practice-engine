id: grammar.for-since-ago
title: For, Since and Ago
kind: grammar
level: elementary
category: grammar.present-perfect
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 19
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: Use for with a duration, since with a starting point, and ago to locate a finished time before now.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main For, Since and Ago distinction and ask the learner to
  choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates For, Since and Ago; add a negative/question transformation when
  that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits For, Since and Ago without naming the grammar point
  in the question.
contrasts:
- for + duration
- since + starting point
- ago = time before now, normally with past simple
related:
- grammar.present-perfect
- grammar.prepositions-time-range
