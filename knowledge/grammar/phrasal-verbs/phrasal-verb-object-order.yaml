id: grammar.phrasal-verb-object-order
title: Phrasal Verb Object Order
kind: grammar
level: elementary
category: grammar.phrasal-verbs
status: normalized-core
source_refs:
- source: egiu-4e
  units:
  - 115
source_coverage: All listed source units are mapped. The KU stores paraphrased core knowledge; source examples and
  exercise sets remain in the source book.
core_concept: With separable phrasal verbs, a noun object may often go before or after the particle, but an object
  pronoun goes between the verb and particle.
mental_model: Retrieve the intended meaning or relationship first, then choose the sentence pattern that expresses
  it.
recognition_drills:
- Generate two original sentences that differ on the main Phrasal Verb Object Order distinction and ask the learner
  to choose the natural/correct one.
production_drills:
- Ask for one original sentence that demonstrates Phrasal Verb Object Order; add a negative/question transformation
  when that form is relevant.
speaking_drills:
- Ask one short everyday or work question that naturally elicits Phrasal Verb Object Order without naming the grammar
  point in the question.
related:
