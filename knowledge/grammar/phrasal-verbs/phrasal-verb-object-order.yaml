id: grammar.phrasal-verb-object-order
title: Object Order with Phrasal Verbs
kind: grammar
level: elementary
category: grammar.phrasal-verbs
status: expanded
source_refs:
  - source: egiu-4e
    units: [115]
source_coverage: Unit 115 separable phrasal verbs with noun objects, obligatory pronoun placement, and common object phrasal verbs are represented.
core_concept: With many separable phrasal verbs, a noun object can go after the particle or between verb and particle, but a pronoun object must go between them.
mental_model: Noun object -> two positions may be possible; it/them -> always put the pronoun in the middle.
forms:
  noun_after: verb + particle + noun
  noun_middle: verb + noun + particle
  pronoun_middle: verb + pronoun + particle
key_items:
  - put on / take off
  - turn on / turn off
  - switch on / switch off
  - pick up / put down
  - bring back / take back / give back / put back
common_mistakes:
  - Say put it on and take them off, not put on it or take off them.
examples:
  - Turn the monitor off, or turn off the monitor; but turn it off.
  - I picked the keys up and put them back.
recognition_drills:
  - Decide which noun-object orders are possible and correct pronoun placement errors.
production_drills:
  - Rewrite noun-object phrasal verbs with pronouns.
speaking_drills:
  - Give me three quick instructions using turn on/off, pick up or put back.
related: [vocabulary.phrasal-verbs-basic]
